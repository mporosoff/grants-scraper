name: Publish validated Pages artifact

on:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# The caller holds funding-finder-coordinated-release throughout publication.
# No push, dispatch or independent checkout can race ahead of Worker preparation.
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy the exact Pages artifact prepared by the release owner
        id: deployment
        uses: actions/deploy-pages@v5
