name: Preview SAM.gov catalog imports

on:
  workflow_dispatch:
    inputs:
      description_notice_ids:
        description: 'Optional: at most two comma-separated notice IDs for short review excerpts'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: sam-import-preview
  cancel-in-progress: false

jobs:
  preview:
    if: github.repository == 'mporosoff/grants-scraper' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Preview one SAM listing and up to two selected descriptions
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
          DESCRIPTION_NOTICE_IDS: ${{ inputs.description_notice_ids }}
        run: >-
          python -m tools.sam_import_preview
          --description-notice-ids "$DESCRIPTION_NOTICE_IDS"
          --report "$RUNNER_TEMP/sam-import-preview/report.json"
      - name: Preserve sanitized preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sam-import-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sam-import-preview/report.json
          if-no-files-found: error
          retention-days: 30
