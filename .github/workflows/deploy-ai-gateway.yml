name: Deploy hosted AI service

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-ai-gateway.yml"
      - "assets/ai-provider.js"
      - "assets/ai-prompts.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tests/browser/ai-gateway-contract.test.mjs"
      - "tests/browser/ai-provider-contract.test.mjs"
      - "workers/ai-gateway/**"

permissions:
  contents: read

concurrency:
  group: funding-finder-ai-release
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: "11.19.0"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify hosted AI boundaries
        run: >-
          node --check assets/ai-provider.js &&
          node --check assets/ai-prompts.mjs &&
          node --check workers/ai-gateway/src/index.js &&
          node --test tests/browser/ai-gateway-contract.test.mjs tests/browser/ai-provider-contract.test.mjs
      - name: Capture the previous Worker version
        id: previous
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          deployments="$(npx --yes wrangler@4.125.0 deployments list --config workers/ai-gateway/wrangler.jsonc --json 2>/dev/null || printf '[]')"
          version_id="$(jq -r '.[0].versions[0].version_id // .[0].id // empty' <<<"$deployments" 2>/dev/null || true)"
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"
      - name: Deploy the protected hosted AI Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4.125.0 deploy
          --config workers/ai-gateway/wrangler.jsonc
          --message "protected-main:${GITHUB_SHA}; hosted AI deployment"
      - name: Verify the deployed service
        id: health
        shell: bash
        run: |
          for attempt in {1..12}; do
            health="$(curl --fail --silent --show-error --max-time 10 -H 'Origin: https://mporosoff.github.io' 'https://funding-finder-ai.urochestercheme.workers.dev/health' || true)"
            if test "$(jq -r '.service // empty' <<<"$health" 2>/dev/null)" = "funding-finder-ai" \
              && test "$(jq -r '.openai_configured | tostring' <<<"$health" 2>/dev/null)" = "true" \
              && test "$(jq -r '.workers_ai_configured | tostring' <<<"$health" 2>/dev/null)" = "true"; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::The hosted AI service did not become ready."
          exit 1
      - name: Roll back after a failed health check
        if: ${{ failure() && steps.health.outcome == 'failure' && steps.previous.outputs.version_id != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4.125.0 rollback "${{ steps.previous.outputs.version_id }}"
          --config workers/ai-gateway/wrangler.jsonc
          --message "automatic rollback after hosted AI health failure"
