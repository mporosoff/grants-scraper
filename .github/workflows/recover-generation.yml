name: Resume proved source transport failures

on:
  workflow_run:
    workflows: ["Funding Finder immutable release"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: write

# The release caller has completed before this executor starts. This distinct
# group serializes request accounting without holding the catalog release lock.
concurrency:
  group: funding-finder-generation-source-retry
  cancel-in-progress: false

jobs:
  recover:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.event == 'schedule' &&
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Authenticate the completed queue and original zero-provider stop
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          CALLER_RUN: ${{ github.event.workflow_run.id }}
          CALLER_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: >-
          python -m tools.generation_source_retry prepare
          --caller "$CALLER_RUN" --caller-attempt "$CALLER_ATTEMPT"
          --directory "$RUNNER_TEMP/source-retry"
      - name: Persist retry intent
        if: steps.prepare.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: generation-source-retry-intent-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-retry/intent.json
          if-no-files-found: error
          retention-days: 90
      - name: Reserve one bounded retry before submitting it
        if: steps.prepare.outputs.ready == 'true'
        run: python -m tools.generation_source_retry arm --directory "$RUNNER_TEMP/source-retry"
      - name: Persist retry request
        if: steps.prepare.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: generation-source-retry-request-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-retry/request.json
          if-no-files-found: error
          retention-days: 90
      - name: Request one exact original failed generate job
        if: steps.prepare.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m tools.generation_source_retry dispatch --directory "$RUNNER_TEMP/source-retry"
      - name: Retain the bounded request outcome without claiming live recovery
        if: always() && steps.prepare.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: generation-source-retry-outcome-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-retry/outcome.json
          if-no-files-found: warn
          retention-days: 90
