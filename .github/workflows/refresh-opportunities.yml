name: Funding Finder immutable release

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:
    inputs:
      stage:
        description: Plan affected work automatically, bounded team maintenance/backfill, or resume exact evidence
        type: choice
        options: [auto, generate, teams, backfill, reuse, catalog-correction, validate, publish, verify]
        default: auto
        required: true
      pilot_team_scopes:
        description: Optional comma-separated current scope IDs for the manual qualification pilot (at most five)
        type: string
      qualification_pilot:
        description: Use the existing five-scope/$2 pilot cap and link all LLM charges to the authorized repair task
        type: boolean
        default: false
      final_integration:
        description: Explicitly run the configured Playwright/accessibility suite on this assembled candidate before publication
        type: boolean
        default: false
      candidate_run:
        description: Artifact-owning run ID (required for validate, publish and verify)
        type: string
      candidate_id:
        description: Complete immutable candidate ID (required for resume)
        type: string
      receipt_run:
        description: Run containing the prior validation receipt (optional for validate/publish, required for verify)
        type: string
      publication_run:
        description: Run containing the expected publication checkpoint (required for verify)
        type: string
      publication_attempt:
        description: Exact publication attempt when selecting older retained evidence
        type: string

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write
  statuses: write
  pages: write
  id-token: write

concurrency:
  group: funding-finder-coordinated-release
  cancel-in-progress: false

jobs:
  plan:
    env:
      QUALIFICATION_PILOT: ${{ inputs.qualification_pilot && 'true' || 'false' }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      stage: ${{ steps.plan.outputs.stage }}
      release_sha: ${{ steps.plan.outputs.release_sha }}
      team_mode: ${{ steps.plan.outputs.team_mode }}
      receipt_run: ${{ steps.plan.outputs.receipt_run }}
      publication_run: ${{ steps.plan.outputs.publication_run }}
      publication_attempt: ${{ steps.plan.outputs.publication_attempt }}
      openai: ${{ steps.plan.outputs.openai }}
      anthropic: ${{ steps.plan.outputs.anthropic }}
      candidate_run: ${{ steps.plan.outputs.candidate_run }}
      candidate_id: ${{ steps.plan.outputs.candidate_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Resolve explicit lifecycle checkpoint
        id: plan
        shell: bash
        env:
          REQUESTED_STAGE: ${{ inputs.stage }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          RECEIPT_RUN: ${{ inputs.receipt_run }}
          PUBLICATION_RUN: ${{ inputs.publication_run }}
          PUBLICATION_ATTEMPT: ${{ inputs.publication_attempt }}
          GH_TOKEN: ${{ github.token }}
        run: python -m tools.catalog_correction_release plan
      - uses: actions/upload-artifact@v4
        with:
          name: release-plan-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-plan.json
          retention-days: 90

  generate:
    env:
      QUALIFICATION_PILOT: ${{ inputs.qualification_pilot && 'true' || 'false' }}
    needs: plan
    if: needs.plan.outputs.stage == 'generate'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      candidate_id: ${{ steps.restore.outputs.candidate_id || steps.persist.outputs.candidate_id }}
      sources_healthy: ${{ steps.additional-sources.outcome == 'success' && steps.document_evidence.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.release_sha }}
          fetch-depth: 0
      - uses: ./.github/actions/release-setup
      - name: Restore an already persisted generation on workflow rerun
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m tools.restore_generation_checkpoint
      - name: Restore the logical spend checkpoint
        if: steps.restore.outputs.candidate_id == ''
        env:
          GH_TOKEN: ${{ github.token }}
          TEAM_MODE: ${{ needs.plan.outputs.team_mode }}
        run: >-
          python -m tools.generation_spend_checkpoint --mode "$TEAM_MODE"
          --state "$RUNNER_TEMP/offline-${GITHUB_RUN_ID}"
          --reservation "$RUNNER_TEMP/spend-reservation.json"
      - name: Reserve the complete logical allowance before provider dispatch
        if: steps.restore.outputs.candidate_id == ''
        uses: actions/upload-artifact@v4
        with:
          name: generation-spend-reservation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/spend-reservation.json
          if-no-files-found: error
          retention-days: 90
      - name: Reserve the linked qualification task before provider dispatch
        if: inputs.qualification_pilot && steps.restore.outputs.candidate_id == ''
        uses: actions/upload-artifact@v4
        with:
          name: offline-ai-economical-ai-20260908-reservation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/offline-${{ github.run_id }}/task-reservation.json
          if-no-files-found: error
          retention-days: 90
      - name: Pin the prior accepted scope snapshot before changes
        if: steps.restore.outputs.candidate_id == ''
        run: |
          python -m tools.team_maintenance --snapshot-before "$RUNNER_TEMP/accepted-scopes.json"
          python -m tools.release_coverage --snapshot-before "$RUNNER_TEMP/coverage-before.json"
      - name: Preserve the prior catalog for change detection
        if: steps.restore.outputs.candidate_id == ''
        shell: bash
        run: cp data/opportunities.js "$RUNNER_TEMP/opportunities.previous.js"
      - name: Build and validate complete public opportunity catalog
        if: steps.restore.outputs.candidate_id == ''
        run: >-
          python -m scripts.build_catalog
          --output data/opportunities.js
          --min-records 1000
          --max-record-count 5000
      - name: Enrich new or changed records with official detail evidence
        if: steps.restore.outputs.candidate_id == ''
        run: >-
          python -m scripts.enrich_catalog
          --catalog data/opportunities.js
          --cache data/opportunity_enrichment.json
          --max-updates 250
          --request-delay 0.25
      - name: Merge additional (non-Grants.gov) sources
        if: steps.restore.outputs.candidate_id == ''
        id: additional-sources
        continue-on-error: true
        env:
          VPR_IMAP_HOST: imap.gmail.com
          VPR_IMAP_USER: ${{ secrets.VPR_IMAP_USER }}
          VPR_IMAP_PASS: ${{ secrets.VPR_IMAP_PASS }}
          VPR_SENDER: VPR_Funding_Opps@lists.rochester.edu
          VPR_LOOKBACK_DAYS: "45"
          VPR_REQUIRED_STREAMS: "vpr,cindy"
          VPR_ENRICH_LINKS: "true"
        run: >-
          python -m scripts.sources merge
          --catalog data/opportunities.js
          --cache data/source_records.json
          --write
          --summary-output "${{ runner.temp }}/source-refresh-summary.json"
          --fail-on-degraded
      - name: Restore private normalized notice structure
        if: steps.restore.outputs.candidate_id == ''
        uses: actions/cache/restore@v4
        with:
          path: .cache/notice-structure
          key: notice-structure-${{ runner.os }}-${{ github.run_id }}
          restore-keys: notice-structure-${{ runner.os }}-
      - name: Extract citation-backed facts from official notices
        if: steps.restore.outputs.candidate_id == ''
        id: document_evidence
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OFFLINE_AI_STATE: ${{ runner.temp }}/offline-${{ github.run_id }}
          TEAM_MODE: ${{ needs.plan.outputs.team_mode }}
        run: >-
          python -m tools.run_budgeted_documents
          --catalog data/opportunities.js
          --cache data/document_evidence.json
          --max-documents 45
          --max-subtopic-documents 30
          --request-delay 0.2
          --recheck-days 14
          --enable-subtopics
      - name: Save private normalized notice structure
        if: steps.restore.outputs.candidate_id == '' && always() && steps.document_evidence.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: .cache/notice-structure
          key: notice-structure-${{ runner.os }}-${{ github.run_id }}
      - name: Rebuild faculty metadata and live team-matcher configuration
        if: steps.restore.outputs.candidate_id == ''
        run: >-
          python -m scripts.faculty_match
          --catalog data/opportunities.js
          --registry config/researcher_registry.json
          --out data/faculty_matches.js
          --version-target team_match.html
      - name: Invalidate proposed teams whose public scope or researcher evidence changed
        if: steps.restore.outputs.candidate_id == ''
        run: python -m scripts.build_opportunity_teams --write --baseline "$RUNNER_TEMP/accepted-scopes.json"
      - name: Restore public-evidence team-generation cache
        if: steps.restore.outputs.candidate_id == ''
        uses: actions/cache@v4
        with:
          path: .cache/opportunity-teams
          key: opportunity-teams-${{ runner.os }}-${{ github.run_id }}
          restore-keys: opportunity-teams-${{ runner.os }}-
      - name: Generate bounded new and changed proposed teams
        if: steps.restore.outputs.candidate_id == ''
        id: team-generation
        timeout-minutes: 20
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ needs.plan.outputs.anthropic == 'true' && secrets.ANTHROPIC_API_KEY || '' }}
          OPENAI_API_KEY: ${{ needs.plan.outputs.openai == 'true' && secrets.OPENAI_API_KEY || '' }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          PILOT_TEAM_SCOPES: ${{ inputs.pilot_team_scopes }}
          TEAM_MODE: ${{ needs.plan.outputs.team_mode }}
        run: >-
          python -m scripts.build_opportunity_teams --generate --max-scopes 60 --workers 3 --write
          --mode "$TEAM_MODE" --state "$RUNNER_TEMP/offline-${GITHUB_RUN_ID}"
          --baseline "$RUNNER_TEMP/accepted-scopes.json"
      - name: Report automatic team coverage and remaining work
        if: steps.restore.outputs.candidate_id == '' && always()
        env:
          TEAM_GENERATION_OUTCOME: ${{ steps.team-generation.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report_path = Path("evaluation/opportunity_team_generation.json")
          try:
              report = json.loads(report_path.read_text())
          except (OSError, ValueError):
              report = {}
          if (not isinstance(report, dict) or str(report.get("run_id")) != os.environ.get("GITHUB_RUN_ID")
                  or str(report.get("run_attempt")) != os.environ.get("GITHUB_RUN_ATTEMPT")
                  or report.get("generation_requested") is not True or report.get("status") != "completed"):
              report = {"processing_failure": {"reason_code": "missing_current_run_receipt"}}
          coverage = report.get("coverage_after", {})
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("\n### Automatic proposed teams\n\n")
              summary.write(f"Generation step: {os.environ['TEAM_GENERATION_OUTCOME']}.\n\n")
              summary.write(f"Candidate coverage: {coverage.get('parent_calls', 'unknown')} distinct calls, "
                            f"{coverage.get('scopes', 'unknown')} bounded topics, "
                            f"{coverage.get('team_combinations', 'unknown')} stored team combinations.\n\n")
              summary.write(f"Completed assessments this run: {report.get('assessed_scopes', 'unknown')}; "
                            f"pending: {report.get('pending_after', 'unknown')}. "
                            f"Outcomes: {json.dumps(report.get('outcomes', {}), sort_keys=True)}.\n\n")
              summary.write(f"Provider requests: {report.get('provider_requests', 'unknown')}; "
                            f"cache/retry counters: {json.dumps(report.get('counters', {}), sort_keys=True)}.\n\n")
              summary.write(f"Processing failures: {json.dumps(report.get('processing_failure', {}), sort_keys=True)}.\n\n")
              summary.write("Source/profile invalidation runs before provider generation. Unavailable responses remain retryable; broad or unsupported scopes do not receive teams.\n")
          PY
      - name: Build deadline, amendment, closing-soon, and closure events
        if: steps.restore.outputs.candidate_id == ''
        run: >-
          python -m scripts.build_changes
          --previous "${{ runner.temp }}/opportunities.previous.js"
          --current data/opportunities.js
          --out feeds
      - name: Rotate through official links and record health and redirects
        if: steps.restore.outputs.candidate_id == ''
        run: >-
          python -m scripts.check_links
          --catalog data/opportunities.js
          --state data/link_health.json
          --max-checks 150
          --workers 8
          --fail-threshold 0.35
      - name: Generate static RSS/Atom feeds from the final catalog
        if: steps.restore.outputs.candidate_id == ''
        run: python -m scripts.build_feeds --catalog data/opportunities.js --out feeds
      - name: Regenerate catalog statistics in project documentation
        if: steps.restore.outputs.candidate_id == ''
        run: python -m scripts.update_catalog_docs
      - name: Record current developer coverage and deltas
        if: steps.restore.outputs.candidate_id == ''
        run: python -m tools.release_coverage --previous "$RUNNER_TEMP/coverage-before.json"
      - name: Build compatible production document vectors
        if: steps.restore.outputs.candidate_id == ''
        id: semantic-vectors
        env:
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
        run: node tools/build_search_v2_voyage_vectors.mjs --production --write
      - name: Build the current/previous Worker compatibility package
        if: steps.restore.outputs.candidate_id == ''
        id: search-package
        shell: bash
        run: |
          curl --fail --silent --show-error --max-filesize 65536 --max-time 30 --retry 2 --retry-max-time 90 \
            "https://mporosoff.github.io/grants-scraper/data/search-v2-release.json?run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -o "${RUNNER_TEMP}/published-search-release.json"
          node tools/build_search_release_package.mjs --write \
            --published-release "${RUNNER_TEMP}/published-search-release.json"
      - name: Record the generation heartbeat before persistence
        if: steps.restore.outputs.candidate_id == ''
        run: date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last_build
      - name: Persist the complete immutable candidate before downstream validation
        if: steps.restore.outputs.candidate_id == ''
        id: persist
        run: python -m tools.release_candidate create --bundle "${{ runner.temp }}/candidate"
      - name: Retain authoritative candidate even if later stages fail
        if: steps.restore.outputs.candidate_id == ''
        uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ steps.persist.outputs.candidate_id }}
          path: ${{ runner.temp }}/candidate
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Retain linked task accounting and exact completed responses
        if: always() && inputs.qualification_pilot && steps.restore.outputs.candidate_id == ''
        uses: actions/upload-artifact@v4
        with:
          name: offline-ai-economical-ai-20260908-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/offline-${{ github.run_id }}/task
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
      - name: Retain spend and completed safe stages after any outcome
        if: always() && steps.restore.outputs.candidate_id == ''
        uses: actions/upload-artifact@v4
        with:
          name: generation-spend-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/offline-${{ github.run_id }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
      - name: Alert the project owner about a degraded external source
        if: >-
          steps.restore.outputs.candidate_id == '' &&
          always() &&
          (steps.additional-sources.outcome == 'failure' ||
          steps.document_evidence.outcome == 'failure')
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("fs");
            const title = "External funding source refresh degraded";
            const runUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`;
            const externalDegraded =
              "${{ steps.additional-sources.outcome }}" === "failure";
            const documentEvidenceDegraded =
              "${{ steps.document_evidence.outcome }}" === "failure";
            const affected = [
              externalDegraded ? "external sources" : null,
              documentEvidenceDegraded ? "document evidence/subtopic classification" : null,
            ].filter(Boolean).join(", ");
            let sourceEvidence = "- Structured source evidence was unavailable; inspect the run log.";
            try {
              const summaryPath = `${process.env.RUNNER_TEMP}/source-refresh-summary.json`;
              const summary = JSON.parse(fs.readFileSync(summaryPath, "utf8"));
              const degraded = (summary.sources || []).filter(
                source => !["refreshed", "recent_snapshot"].includes(source.status)
              );
              const validation = summary.validation || {};
              if (degraded.length) {
                sourceEvidence = degraded.map(source => {
                  const lastSuccess = source.last_successful_refresh_at
                    || "none under the current verified contract";
                  const retainedAge = Number.isInteger(source.retained_data_age_days)
                    ? `${source.retained_data_age_days} day(s)`
                    : "not applicable (no retained records published)";
                  return `- **${source.source}** (\`${source.slug}\`): ` +
                    `failure class \`${source.failure_class || "unknown"}\`; ` +
                    `last successful refresh ${lastSuccess}; retained-data age ${retainedAge}; ` +
                    `publication decision \`${source.publication_decision || "unknown"}\`.`;
                }).join("\n");
              } else if (validation.ok === false) {
                const validationError = String(
                  validation.error || "post-merge catalog validation failed"
                ).slice(0, 500);
                sourceEvidence =
                  `- External-source post-merge validation failed: ${validationError}`;
              } else if (documentEvidenceDegraded) {
                sourceEvidence = "- All external sources were healthy; degradation was confined to document evidence/classification.";
              } else {
                sourceEvidence =
                  "- The external-source step failed without a degraded adapter or validation detail; inspect the run log.";
              }
            } catch (error) {
              core.warning(`Could not read structured source summary: ${error.message}`);
            }
            const body =
              `The degraded refresh layer(s) were: ${affected}. ` +
              `This occurred on ${new Date().toISOString()}.\n\n` +
              `Healthy sources were still refreshed. Sources configured to retain ` +
              `last-known-good data kept only publishable records; fail-closed sources ` +
              `published zero. Document-evidence or classifier degradation cannot ` +
              `publish unchecked generic children.\n\nSource health evidence:\n${sourceEvidence}` +
              `\n\nInspect the run summary: ${runUrl}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "all",
              sort: "updated",
              direction: "desc",
              per_page: 100,
            });
            const existing = issues.find(
              issue => !issue.pull_request && issue.title === title
            );
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
                state: "open",
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

  assemble:
    env:
      QUALIFICATION_PILOT: ${{ inputs.qualification_pilot && 'true' || 'false' }}
    needs: plan
    if: contains(fromJSON('["reuse","teams","backfill"]'), needs.plan.outputs.stage)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      candidate_id: ${{ steps.restore.outputs.candidate_id || steps.persist.outputs.candidate_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.release_sha }}
          fetch-depth: 0
      - uses: ./.github/actions/release-setup
      - name: Restore a completed derived candidate on workflow rerun
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m tools.restore_generation_checkpoint
      - name: Load the currently published candidate for data reuse
        if: steps.restore.outputs.candidate_id == ''
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ needs.plan.outputs.candidate_run }}
          CANDIDATE_ID: ${{ needs.plan.outputs.candidate_id }}
        run: >-
          python -m tools.fetch_release_artifact --repository "$GITHUB_REPOSITORY"
          --run "$CANDIDATE_RUN" --name "candidate-$CANDIDATE_ID" --destination "$RUNNER_TEMP/previous-candidate"
      - name: Verify and materialize unchanged source and semantic inputs
        if: steps.restore.outputs.candidate_id == ''
        env:
          TEAM_UPDATE: ${{ needs.plan.outputs.stage != 'reuse' && '--team-update' || '' }}
        run: python -m tools.assemble_release_candidate --bundle "$RUNNER_TEMP/previous-candidate" $TEAM_UPDATE
      - name: Restore the logical spend checkpoint
        if: steps.restore.outputs.candidate_id == '' && needs.plan.outputs.stage != 'reuse'
        env:
          GH_TOKEN: ${{ github.token }}
          TEAM_MODE: ${{ needs.plan.outputs.team_mode }}
        run: >-
          python -m tools.generation_spend_checkpoint --mode "$TEAM_MODE"
          --state "$RUNNER_TEMP/offline-${GITHUB_RUN_ID}"
          --reservation "$RUNNER_TEMP/spend-reservation.json"
      - name: Reserve the complete logical allowance before provider dispatch
        if: steps.restore.outputs.candidate_id == '' && needs.plan.outputs.stage != 'reuse'
        uses: actions/upload-artifact@v4
        with:
          name: generation-spend-reservation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/spend-reservation.json
          if-no-files-found: error
          retention-days: 90
      - name: Reserve the linked qualification task before provider dispatch
        if: inputs.qualification_pilot && steps.restore.outputs.candidate_id == ''
        uses: actions/upload-artifact@v4
        with:
          name: offline-ai-economical-ai-20260908-reservation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/offline-${{ github.run_id }}/task-reservation.json
          if-no-files-found: error
          retention-days: 90
      - name: Pin the prior accepted scope snapshot before changes
        if: steps.restore.outputs.candidate_id == '' && needs.plan.outputs.stage != 'reuse'
        run: |
          python -m tools.team_maintenance --snapshot-before "$RUNNER_TEMP/accepted-scopes.json"
          python -m tools.release_coverage --snapshot-before "$RUNNER_TEMP/coverage-before.json"
      - name: Restore optional public-derived team response and retrieval cache
        if: steps.restore.outputs.candidate_id == '' && needs.plan.outputs.stage != 'reuse'
        uses: actions/cache@v4
        with:
          path: .cache/opportunity-teams
          key: opportunity-teams-${{ runner.os }}-${{ github.run_id }}
          restore-keys: opportunity-teams-${{ runner.os }}-
      - name: Run only bounded selected team work on the pinned catalog
        timeout-minutes: 20
        if: steps.restore.outputs.candidate_id == '' && needs.plan.outputs.stage != 'reuse'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ needs.plan.outputs.anthropic == 'true' && secrets.ANTHROPIC_API_KEY || '' }}
          OPENAI_API_KEY: ${{ needs.plan.outputs.openai == 'true' && secrets.OPENAI_API_KEY || '' }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          PILOT_TEAM_SCOPES: ${{ inputs.pilot_team_scopes }}
          TEAM_MODE: ${{ needs.plan.outputs.team_mode }}
        run: |
          python -m scripts.build_opportunity_teams --generate --write --mode "$TEAM_MODE" \
            --state "$RUNNER_TEMP/offline-${GITHUB_RUN_ID}" --baseline "$RUNNER_TEMP/accepted-scopes.json"
      - name: Rebuild current researcher projections without provider work
        if: steps.restore.outputs.candidate_id == '' && needs.plan.outputs.stage != 'reuse'
        run: python -m tools.team_maintenance --rebuild-projections
      - name: Record current developer coverage
        if: steps.restore.outputs.candidate_id == '' && needs.plan.outputs.stage != 'reuse'
        run: python -m tools.release_coverage --previous "$RUNNER_TEMP/coverage-before.json"
      - name: Prove a warm replay with new selection disabled
        if: steps.restore.outputs.candidate_id == '' && needs.plan.outputs.stage != 'reuse'
        run: python -m tools.replay_team_maintenance

      - name: Assemble runtime compatibility metadata around unchanged generated data
        if: steps.restore.outputs.candidate_id == ''
        run: node tools/build_search_release_package.mjs --write
      - name: Persist derived candidate with original generation provenance
        id: persist
        if: steps.restore.outputs.candidate_id == ''
        env:
          TEAM_UPDATE: ${{ needs.plan.outputs.stage != 'reuse' && '--team-update' || '' }}
        run: python -m tools.release_candidate create --bundle "$RUNNER_TEMP/candidate" --parent "$RUNNER_TEMP/previous-candidate" $TEAM_UPDATE
      - uses: actions/upload-artifact@v4
        if: steps.restore.outputs.candidate_id == ''
        with:
          name: candidate-${{ steps.persist.outputs.candidate_id }}
          path: ${{ runner.temp }}/candidate
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Retain linked task accounting and exact completed responses
        if: always() && inputs.qualification_pilot && steps.restore.outputs.candidate_id == ''
        uses: actions/upload-artifact@v4
        with:
          name: offline-ai-economical-ai-20260908-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/offline-${{ github.run_id }}/task
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
      - name: Retain spend and completed safe stages after any outcome
        if: always() && steps.restore.outputs.candidate_id == '' && needs.plan.outputs.stage != 'reuse'
        uses: actions/upload-artifact@v4
        with:
          name: generation-spend-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/offline-${{ github.run_id }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90

  catalog-correction:
    needs: plan
    if: needs.plan.outputs.stage == 'catalog-correction'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      candidate_id: ${{ steps.restore.outputs.candidate_id || steps.recover.outputs.candidate_id || steps.persist.outputs.candidate_id }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.release_sha }}
          fetch-depth: 0
      - uses: ./.github/actions/release-setup
      - name: Restore this logical run's exact completed candidate
        id: restore
        run: python -m tools.restore_generation_checkpoint
      - name: Recover the exact retained candidate without repeating generation
        id: recover
        if: steps.restore.outputs.candidate_id == ''
        run: >-
          python -m tools.catalog_correction_release recover-candidate
          --bundle "$RUNNER_TEMP/candidate" --reports "$RUNNER_TEMP/catalog-recovery"
      - name: Import the authenticated seven-vector export and retain original generation
        id: persist
        if: steps.restore.outputs.candidate_id == '' && steps.recover.outputs.candidate_id == ''
        run: >-
          python -m tools.catalog_correction_release create
          --work "$RUNNER_TEMP/catalog-correction" --bundle "$RUNNER_TEMP/candidate"
      - name: Retain the standard immutable public candidate
        if: steps.restore.outputs.candidate_id == '' && (steps.recover.outcome == 'success' || steps.persist.outcome == 'success')
        uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ steps.recover.outputs.candidate_id || steps.persist.outputs.candidate_id }}
          path: ${{ runner.temp }}/candidate
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Retain the safe exact-candidate recovery provenance
        if: always() && steps.recover.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: catalog-candidate-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/catalog-recovery/recovery.json
          if-no-files-found: error
          retention-days: 90

  candidate:
    needs: [plan, generate, assemble, catalog-correction]
    if: >-
      always() && needs.plan.result == 'success' && needs.plan.outputs.stage != 'noop' &&
      (needs.generate.result == 'success' || needs.assemble.result == 'success' || needs.catalog-correction.result == 'success' ||
       (needs.generate.result == 'skipped' && needs.assemble.result == 'skipped' && needs.catalog-correction.result == 'skipped'))
    runs-on: ubuntu-latest
    outputs:
      candidate_id: ${{ steps.select.outputs.candidate_id }}
      candidate_run: ${{ steps.select.outputs.candidate_run }}
    steps:
      - name: Select the immutable artifact checkpoint
        id: select
        env:
          GENERATED_ID: ${{ needs.generate.outputs.candidate_id || needs.assemble.outputs.candidate_id || needs.catalog-correction.outputs.candidate_id }}
          REQUESTED_ID: ${{ needs.plan.outputs.candidate_id }}
          REQUESTED_RUN: ${{ needs.plan.outputs.candidate_run }}
        run: |
          echo "candidate_id=${GENERATED_ID:-$REQUESTED_ID}" >> "$GITHUB_OUTPUT"
          if [ -n "$GENERATED_ID" ]; then
            echo "candidate_run=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          else
            echo "candidate_run=$REQUESTED_RUN" >> "$GITHUB_OUTPUT"
          fi

  validate:
    needs: [plan, candidate]
    if: ${{ !cancelled() && needs.candidate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_ID: ${{ needs.candidate.outputs.candidate_id }}
      CANDIDATE_RUN: ${{ needs.candidate.outputs.candidate_run }}
      RECEIPT_RUN: ${{ needs.candidate.outputs.candidate_id == needs.plan.outputs.candidate_id && needs.plan.outputs.receipt_run || '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.release_sha }}
          fetch-depth: 0
      - uses: ./.github/actions/release-setup
      - name: Load the exact persisted candidate
        run: >-
          python -m tools.fetch_release_artifact --repository "$GITHUB_REPOSITORY"
          --run "$CANDIDATE_RUN" --name "candidate-$CANDIDATE_ID" --destination "$RUNNER_TEMP/candidate"
      - name: Verify candidate provenance and current generation dependencies
        run: |
          python -m tools.release_candidate verify --bundle "$RUNNER_TEMP/candidate" --candidate-id "$CANDIDATE_ID"
          python -m tools.release_candidate dependencies --bundle "$RUNNER_TEMP/candidate"
      - name: Load prior validation evidence for checkpoint reuse
        if: env.RECEIPT_RUN != ''
        run: >-
          python -m tools.fetch_release_artifact --repository "$GITHUB_REPOSITORY"
          --run "$RECEIPT_RUN" --name "validation-$CANDIDATE_ID" --destination "$RUNNER_TEMP/previous-validation"
      - name: Validate a working copy of the persisted candidate or reuse its exact receipt
        env:
          FINAL_INTEGRATION_REQUIRED: ${{ github.event_name == 'workflow_dispatch' && inputs.final_integration && 'true' || 'false' }}
        run: >-
          python -m tools.validate_release_candidate --bundle "$RUNNER_TEMP/candidate"
          --reports "$RUNNER_TEMP/reports" --previous "$RUNNER_TEMP/previous-validation/validation.json"
      - name: Run explicitly authorized final browser integration or reuse its exact receipt
        if: github.event_name == 'workflow_dispatch' && inputs.final_integration
        run: >-
          python -m tools.validate_release_candidate --final-integration --bundle "$RUNNER_TEMP/candidate"
          --reports "$RUNNER_TEMP/reports" --previous "$RUNNER_TEMP/previous-validation/final-integration.json"
      - name: Retain safe reports and receipt on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ needs.candidate.outputs.candidate_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reports
          if-no-files-found: warn
          retention-days: 90

  publish:
    needs: [plan, candidate, validate]
    if: >-
      !cancelled() && needs.validate.result == 'success' &&
      needs.plan.outputs.stage != 'validate' && needs.plan.outputs.stage != 'verify'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      merge_sha: ${{ steps.publication.outputs.merge_sha }}
      review_ready: ${{ steps.review.outputs.review_ready }}
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_ID: ${{ needs.candidate.outputs.candidate_id }}
      CANDIDATE_RUN: ${{ needs.candidate.outputs.candidate_run }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.release_sha }}
          fetch-depth: 0
      - uses: ./.github/actions/release-setup
      - name: Load the exact validated candidate
        run: >-
          python -m tools.fetch_release_artifact --repository "$GITHUB_REPOSITORY"
          --run "$CANDIDATE_RUN" --name "candidate-$CANDIDATE_ID" --destination "$RUNNER_TEMP/candidate"
      - name: Load the latest validation checkpoint, including prior workflow attempts
        run: >-
          python -m tools.fetch_release_artifact --repository "$GITHUB_REPOSITORY"
          --run "$GITHUB_RUN_ID" --name "validation-$CANDIDATE_ID" --destination "$RUNNER_TEMP/reports"
      - name: Verify receipt before materializing the candidate
        run: |
          python -m tools.release_candidate receipt --bundle "$RUNNER_TEMP/candidate" --receipt "$RUNNER_TEMP/reports/validation.json"
          python -m tools.release_candidate materialize --bundle "$RUNNER_TEMP/candidate"
      - name: Select the exact candidate's smoke accounting route
        id: accounting
        run: python -m tools.catalog_correction_release mode --bundle "$RUNNER_TEMP/candidate"
      - name: Establish exact-head review readiness before changing serving state
        id: review
        run: >-
          python -m tools.prepare_release_publication --bundle "$RUNNER_TEMP/candidate"
          --receipt "$RUNNER_TEMP/reports/validation.json" --reports "$RUNNER_TEMP/reports" --artifact-run "$CANDIDATE_RUN"
      - name: Recheck compatibility with the package actually served by Pages
        if: steps.review.outputs.review_ready == 'true'
        run: |
          curl --fail --silent --show-error --max-filesize 65536 --max-time 30 --retry 2 --retry-max-time 90 \
            "https://mporosoff.github.io/grants-scraper/data/search-v2-release.json?predeploy=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -o "$RUNNER_TEMP/reports/known-good-live-release.json"
          node tools/build_search_release_package.mjs --check --published-release "$RUNNER_TEMP/reports/known-good-live-release.json"
      - name: Capture actual serving Worker provenance and compare complete input fingerprints
        if: steps.review.outputs.review_ready == 'true'
        id: worker-inputs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.125.0 deployments list --config workers/search-voyage-proxy/wrangler.jsonc --json > "$RUNNER_TEMP/deployments.json"
          node tools/search_worker_checkpoint.mjs "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/deployments.json" "$RUNNER_TEMP/reports/worker-checkpoint.json"
      - name: Deploy changed Worker inputs before publishing Pages assets
        id: worker-deploy
        if: steps.worker-inputs.outputs.deploy_required == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_FINGERPRINT: ${{ steps.worker-inputs.outputs.fingerprint }}
        run: >-
          npx --yes wrangler@4.125.0 deploy --config workers/search-voyage-proxy/wrangler.jsonc
          --message "protected-main:$(git rev-parse HEAD); input-sha256:$WORKER_FINGERPRINT; candidate:$CANDIDATE_ID"
      - name: Verify the candidate-compatible Worker handshake
        if: steps.review.outputs.review_ready == 'true'
        run: python -m tools.verify_release_live worker --bundle "$RUNNER_TEMP/candidate" --reports "$RUNNER_TEMP/reports"
      - name: Run a real provider smoke before publication
        if: steps.review.outputs.review_ready == 'true' && steps.accounting.outputs.fixed_correction == 'false'
        env:
          FUNDING_RELEASE_INPUT_ROOT: ${{ runner.temp }}/candidate/files
        run: node tools/smoke_search_worker.mjs
      - name: Verify the active Worker fingerprint after deployment or retention
        if: steps.review.outputs.review_ready == 'true' && steps.accounting.outputs.fixed_correction == 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.125.0 deployments list --config workers/search-voyage-proxy/wrangler.jsonc --json > "$RUNNER_TEMP/deployments-after.json"
          node tools/search_worker_checkpoint.mjs "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/deployments-after.json" "$RUNNER_TEMP/reports/worker-after.json"
          test "$(jq -r .deploy_required "$RUNNER_TEMP/reports/worker-after.json")" = false
      - name: Authenticate complete corrected candidate serving bytes and safe source context
        id: smoke-context
        if: steps.review.outputs.review_ready == 'true' && steps.accounting.outputs.fixed_correction == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.125.0 deployments list --config workers/search-voyage-proxy/wrangler.jsonc --json > "$RUNNER_TEMP/reports/deployments-after.json"
          python -m tools.catalog_correction_release context --bundle "$RUNNER_TEMP/candidate" --reports "$RUNNER_TEMP/reports" --work "$RUNNER_TEMP/catalog-context"
      - name: Retain the authenticated public smoke context before any owner dispatch
        if: steps.review.outputs.review_ready == 'true' && steps.smoke-context.outcome == 'success' && steps.smoke-context.outputs.context_reused == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.smoke-context.outputs.context_artifact }}
          path: ${{ runner.temp }}/catalog-context/context
          if-no-files-found: error
          retention-days: 90
      - name: Plan the fixed query smoke or exact cached reuse
        id: smoke-embed-plan
        if: steps.review.outputs.review_ready == 'true' && steps.smoke-context.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python -m tools.catalog_correction_release plan-smoke --name smoke-embed --bundle "$RUNNER_TEMP/candidate" --reports "$RUNNER_TEMP/reports" --work "$RUNNER_TEMP/catalog-smokes"
      - name: Retain the query dispatch intent before submission
        if: steps.review.outputs.review_ready == 'true' && steps.smoke-embed-plan.outputs.smoke_status == 'new_intent'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.smoke-embed-plan.outputs.intent_artifact }}
          path: ${{ steps.smoke-embed-plan.outputs.intent_path }}
          if-no-files-found: error
          retention-days: 90
      - name: Wait for the sole owner's query smoke without redispatch
        if: steps.review.outputs.review_ready == 'true' && steps.smoke-embed-plan.outcome == 'success'
        run: python -m tools.catalog_correction_release run-smoke --name smoke-embed --reports "$RUNNER_TEMP/reports" --work "$RUNNER_TEMP/catalog-smokes"
      - name: Plan the fixed current corpus smoke or exact cached reuse
        id: smoke-current-plan
        if: steps.review.outputs.review_ready == 'true' && steps.smoke-context.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python -m tools.catalog_correction_release plan-smoke --name smoke-current-rerank --bundle "$RUNNER_TEMP/candidate" --reports "$RUNNER_TEMP/reports" --work "$RUNNER_TEMP/catalog-smokes"
      - name: Retain the current corpus dispatch intent before submission
        if: steps.review.outputs.review_ready == 'true' && steps.smoke-current-plan.outputs.smoke_status == 'new_intent'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.smoke-current-plan.outputs.intent_artifact }}
          path: ${{ steps.smoke-current-plan.outputs.intent_path }}
          if-no-files-found: error
          retention-days: 90
      - name: Wait for the sole owner's current corpus smoke without redispatch
        if: steps.review.outputs.review_ready == 'true' && steps.smoke-current-plan.outcome == 'success'
        run: python -m tools.catalog_correction_release run-smoke --name smoke-current-rerank --reports "$RUNNER_TEMP/reports" --work "$RUNNER_TEMP/catalog-smokes"
      - name: Plan the fixed previous corpus smoke or zero-provider receipt recovery
        id: smoke-previous-plan
        if: steps.review.outputs.review_ready == 'true' && steps.smoke-context.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python -m tools.catalog_correction_release plan-smoke --name smoke-previous-rerank --bundle "$RUNNER_TEMP/candidate" --reports "$RUNNER_TEMP/reports" --work "$RUNNER_TEMP/catalog-smokes"
      - name: Retain the previous corpus or zero-provider recovery dispatch intent
        if: steps.review.outputs.review_ready == 'true' && steps.smoke-previous-plan.outputs.smoke_status == 'new_intent'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.smoke-previous-plan.outputs.intent_artifact }}
          path: ${{ steps.smoke-previous-plan.outputs.intent_path }}
          if-no-files-found: error
          retention-days: 90
      - name: Wait for the sole owner's previous corpus smoke and durable aggregate
        if: steps.review.outputs.review_ready == 'true' && steps.smoke-previous-plan.outcome == 'success'
        run: python -m tools.catalog_correction_release run-smoke --name smoke-previous-rerank --reports "$RUNNER_TEMP/reports" --work "$RUNNER_TEMP/catalog-smokes"
      - name: Verify all three accepted owned smokes against fresh unchanged serving bytes
        id: owned-provider
        if: steps.review.outputs.review_ready == 'true' && steps.smoke-context.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python -m tools.catalog_correction_release reuse-smoke --bundle "$RUNNER_TEMP/candidate" --reports "$RUNNER_TEMP/reports" --work "$RUNNER_TEMP/catalog-smokes"
      - name: Materialize exact candidate bytes through protected publication and verify merged hashes
        if: steps.review.outputs.review_ready == 'true'
        id: publication
        run: >-
          python -m tools.publish_release_candidate --bundle "$RUNNER_TEMP/candidate"
          --receipt "$RUNNER_TEMP/reports/validation.json" --reports "$RUNNER_TEMP/reports" --artifact-run "$CANDIDATE_RUN"
          --prepared "$RUNNER_TEMP/reports/review-ready.json"
      - name: Retain the fully tested Worker after a late incomplete publication
        id: owned-worker-retained
        if: ${{ failure() && steps.review.outputs.review_ready == 'true' && steps.owned-provider.outcome == 'success' && steps.publication.outcome != 'success' }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from tools.offline_spend import atomic_json
          reports = Path(os.environ['RUNNER_TEMP']) / 'reports'
          manifest = json.loads((Path(os.environ['RUNNER_TEMP']) / 'candidate/candidate.json').read_bytes())
          worker = json.loads((reports / 'worker-after.json').read_bytes())
          smoke = json.loads((reports / 'catalog-smoke-reuse.json').read_bytes())
          pages = json.loads((reports / 'known-good-live-release.json').read_bytes())
          progress_path = reports / 'publication-progress.json'
          progress = json.loads(progress_path.read_bytes()) if progress_path.exists() else None
          generation = ('previous' if pages['current_corpus_sha256'] == smoke['previous_corpus_sha256'] else
                        'current' if pages['current_corpus_sha256'] == smoke['current_corpus_sha256'] else None)
          assert smoke['status'] == 'passed_reused' and smoke['original_provider_requests'] == 3 and generation
          expected_space = smoke['previous_model_space_fingerprint'] if generation == 'previous' else smoke['model_space_fingerprint']
          assert pages['model_space_fingerprint'] == expected_space and smoke['serving_version_id'] == worker['version_id']
          assert worker['candidate']['candidate_id'] == manifest['candidate_id']
          merged = bool(progress and progress.get('candidate_id') == manifest['candidate_id'] and progress.get('protected_merge_completed') is True)
          record = {'version': 'catalog-owned-worker-retention-v1', 'candidate_id': manifest['candidate_id'],
              'publication_status': 'protected_merge_recorded_publication_incomplete' if merged else 'publication_unconfirmed',
              'pages_publication_complete': False, 'protected_merge_progress': progress,
              'retained_version_id': worker['version_id'], 'retained_deployment_id': worker['checkpoint']['activeDeploymentId'],
              'worker_checkpoint_sha256': hashlib.sha256((reports / 'worker-after.json').read_bytes()).hexdigest(),
              'owned_smoke_receipt_sha256': smoke['receipt_sha256'], 'authoritative_run_id': smoke['authoritative_run_id'],
              'authoritative_checkpoint_sha256': smoke['authoritative_checkpoint_sha256'],
              'pages_corpus_sha256': pages['current_corpus_sha256'], 'pages_compatibility_checked_generation': generation,
              'owned_previous_corpus_smoke': 'passed', 'new_provider_calls': 0, 'worker_mutation_performed': False,
              'next_retry_stage': 'publish', 'resume_requires_fresh_unchanged_serving_proof': True}
          atomic_json(reports / 'owned-worker-retained.json', record)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf8') as summary:
              summary.write('\nPublication is incomplete; Pages completion is not claimed. The workflow retained the fully tested Worker '
                  + worker['version_id'] + ' at deployment ' + worker['checkpoint']['activeDeploymentId']
                  + '. The existing Pages corpus matches the checked ' + generation
                  + ' generation, and the real previous-corpus smoke passed. Resume the exact candidate with fresh provenance and zero new provider calls.\n')
          PY
      - name: Restore the captured serving version if pre-publication fails
        if: ${{ failure() && steps.worker-deploy.outcome == 'success' && steps.publication.outcome != 'success' && steps.owned-provider.outcome != 'success' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PRIOR_VERSION: ${{ steps.worker-inputs.outputs.version_id }}
        run: >-
          npx --yes wrangler@4.125.0 rollback "$PRIOR_VERSION"
          --config workers/search-voyage-proxy/wrangler.jsonc
          --message "Automatic rollback to the captured serving version after candidate publication failure"
      - name: Package verified candidate bytes for Pages
        if: steps.review.outputs.review_ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python -m tools.verify_release_live stage --bundle "$RUNNER_TEMP/candidate" --reports "$RUNNER_TEMP/reports" --output "$RUNNER_TEMP/site"
      - uses: actions/configure-pages@v6
        if: steps.review.outputs.review_ready == 'true'
      - uses: actions/upload-pages-artifact@v5
        if: steps.review.outputs.review_ready == 'true'
        with:
          path: ${{ runner.temp }}/site
      - name: Persist the publication checkpoint and exact serving-version evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-${{ needs.candidate.outputs.candidate_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reports
          if-no-files-found: warn
          retention-days: 90

  pages:
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.publish.outputs.merge_sha != '' }}
    uses: ./.github/workflows/pages.yml

  verify-live:
    needs: [plan, candidate, validate, publish, pages]
    if: >-
      !cancelled() && needs.validate.result == 'success' &&
      (needs.pages.result == 'success' || needs.plan.outputs.stage == 'verify')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_ID: ${{ needs.candidate.outputs.candidate_id }}
      CANDIDATE_RUN: ${{ needs.candidate.outputs.candidate_run }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.release_sha }}
          fetch-depth: 0
      - uses: ./.github/actions/release-setup
      - name: Load published candidate for read-only live verification
        run: >-
          python -m tools.fetch_release_artifact --repository "$GITHUB_REPOSITORY"
          --run "$CANDIDATE_RUN" --name "candidate-$CANDIDATE_ID" --destination "$RUNNER_TEMP/candidate"
      - name: Select the published candidate's smoke accounting route
        id: accounting
        run: python -m tools.catalog_correction_release mode --bundle "$RUNNER_TEMP/candidate"
      - name: Load the expected publication receipt and its original validation evidence
        env:
          PUBLICATION_RUN: ${{ needs.publish.result == 'success' && github.run_id || needs.plan.outputs.publication_run }}
          PUBLICATION_ATTEMPT: ${{ needs.plan.outputs.stage == 'verify' && needs.plan.outputs.publication_attempt || '' }}
        run: |
          artifact="publication-$CANDIDATE_ID"
          if [ -n "$PUBLICATION_ATTEMPT" ]; then artifact="$artifact-$PUBLICATION_ATTEMPT"; fi
          python -m tools.fetch_release_artifact --repository "$GITHUB_REPOSITORY" \
            --run "$PUBLICATION_RUN" --name "$artifact" --destination "$RUNNER_TEMP/reports"
      - name: Check exact Pages bytes, runtime, catalog, teams, vectors and Worker handshake
        id: live-assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python -m tools.verify_release_live verify --bundle "$RUNNER_TEMP/candidate" --reports "$RUNNER_TEMP/reports"
      - name: Run a real provider smoke after Pages propagation
        id: live-provider
        if: steps.accounting.outputs.fixed_correction == 'false'
        env:
          FUNDING_RELEASE_INPUT_ROOT: ${{ runner.temp }}/candidate/files
        run: node tools/smoke_search_worker.mjs
      - name: Reuse the exact three owned smokes after fresh full serving reconciliation
        id: live-owned-provider
        if: steps.accounting.outputs.fixed_correction == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python -m tools.catalog_correction_release reuse-smoke --bundle "$RUNNER_TEMP/candidate" --reports "$RUNNER_TEMP/reports" --work "$RUNNER_TEMP/catalog-reuse"
      - name: Record the complete live result including provider smoke
        if: always()
        env:
          ASSET_OUTCOME: ${{ steps.live-assets.outcome }}
          PROVIDER_OUTCOME: ${{ steps.accounting.outputs.fixed_correction == 'true' && steps.live-owned-provider.outcome || steps.live-provider.outcome }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          python -m tools.verify_release_live complete --bundle "$RUNNER_TEMP/candidate" --reports "$RUNNER_TEMP/reports"
          --asset-outcome "$ASSET_OUTCOME" --provider-outcome "$PROVIDER_OUTCOME"
      - name: Retain live release identity and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-${{ needs.candidate.outputs.candidate_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reports
          if-no-files-found: warn
          retention-days: 90

  closeout:
    needs: [plan, generate, assemble, catalog-correction, candidate, validate, publish, pages, verify-live]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report the exact lifecycle checkpoint and allowed retry
        uses: actions/github-script@v8
        env:
          RESULTS: ${{ toJSON(needs) }}
          REQUESTED_STAGE: ${{ inputs.stage }}
          REQUESTED_CANDIDATE_ID: ${{ inputs.candidate_id }}
          REQUESTED_CANDIDATE_RUN: ${{ inputs.candidate_run }}
          REQUESTED_RECEIPT_RUN: ${{ inputs.receipt_run }}
          REQUESTED_PUBLICATION_RUN: ${{ inputs.publication_run }}
          REQUESTED_PUBLICATION_ATTEMPT: ${{ inputs.publication_attempt }}
        with:
          script: |
            const needs = JSON.parse(process.env.RESULTS);
            const order = ['plan', 'generate', 'assemble', 'catalog-correction', 'candidate', 'validate', 'publish', 'pages', 'verify-live'];
            const failed = order.find(stage => ['failure', 'cancelled'].includes(needs[stage].result));
            const stages = new Set(['auto', 'generate', 'teams', 'backfill', 'reuse', 'catalog-correction', 'validate', 'publish', 'verify']);
            const planned = needs.plan.outputs.stage;
            const originalStage = stages.has(planned) ? planned : stages.has(process.env.REQUESTED_STAGE) ? process.env.REQUESTED_STAGE : 'auto';
            let candidate = needs.candidate.outputs.candidate_id;
            let generationRun = needs.candidate.outputs.candidate_run;
            let identitySource = 'selected candidate output';
            if (!candidate || !generationRun) {
              const producer = ['generate', 'assemble', 'catalog-correction'].find(stage =>
                needs[stage].result === 'success' && needs[stage].outputs.candidate_id);
              if (producer) {
                candidate = needs[producer].outputs.candidate_id; generationRun = String(context.runId);
                identitySource = `successful ${producer} job; authenticate its retained artifact before reuse`;
              } else {
                const completePlan = needs.plan.outputs.candidate_id && needs.plan.outputs.candidate_run;
                candidate = completePlan ? needs.plan.outputs.candidate_id : process.env.REQUESTED_CANDIDATE_ID;
                generationRun = completePlan ? needs.plan.outputs.candidate_run : process.env.REQUESTED_CANDIDATE_RUN;
                identitySource = 'requested checkpoint selector; artifact authentication still required';
              }
            }
            const hasCheckpoint = Boolean(candidate && generationRun);
            if (!hasCheckpoint) { candidate = 'not persisted'; generationRun = 'none'; identitySource = 'no complete checkpoint selector'; }
            const awaiting = needs.publish.outputs.review_ready === 'false';
            const next = failed === 'pages' ? 'publish' : failed === 'verify-live' ? 'verify' :
              ['publish', 'validate'].includes(failed) ? failed : failed === 'candidate' && hasCheckpoint ?
              (['publish', 'verify'].includes(originalStage) ? originalStage : 'validate') : originalStage;
            const sameRequested = hasCheckpoint && ((candidate === needs.plan.outputs.candidate_id && generationRun === needs.plan.outputs.candidate_run) ||
              (candidate === process.env.REQUESTED_CANDIDATE_ID && generationRun === process.env.REQUESTED_CANDIDATE_RUN));
            const receiptRun = needs.validate.result === 'success' ? String(context.runId) :
              sameRequested ? needs.plan.outputs.receipt_run || process.env.REQUESTED_RECEIPT_RUN || 'none' : 'none';
            const publicationRun = ['success', 'failure', 'cancelled'].includes(needs.publish.result) ? String(context.runId) :
              sameRequested ? needs.plan.outputs.publication_run || process.env.REQUESTED_PUBLICATION_RUN || 'none' : 'none';
            const publicationAttempt = publicationRun === String(context.runId) ? process.env.GITHUB_RUN_ATTEMPT || 'unknown' :
              sameRequested ? needs.plan.outputs.publication_attempt || process.env.REQUESTED_PUBLICATION_ATTEMPT || 'latest retained' : 'none';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `Candidate: ${candidate}\nArtifact run: ${generationRun}\nStage: ${failed || (awaiting ? 'awaiting_review' : 'completed')}\n` +
              `Identity source: ${identitySource}\nOriginal lifecycle stage: ${originalStage}\nValidation receipt run: ${receiptRun}\n` +
              `Publication evidence run: ${publicationRun}\nPublication evidence attempt: ${publicationAttempt}\n` +
              `Release-control SHA: ${context.sha}\nProtected publication SHA: ${needs.publish.outputs.merge_sha || 'none confirmed'}\n` +
              `Production mutation: ${needs.publish.outputs.merge_sha ? 'protected publication completed' : needs.publish.result === 'failure' ? 'inspect publication receipt and rollback evidence' : 'none'}\n` +
              `Known-good live identity: publication artifact known-good-live-release.json (when Worker preparation started)\n` +
              `Evidence and safe diagnostics: ${runUrl}#artifacts\nAllowed next retry: ${failed ? next : awaiting ? 'publish after exact-head review' : 'none'}\n` +
              `Resume the same workflow for pre-candidate failures so its persisted generation checkpoint can be recovered; do not repeat completed expensive work.\n` +
              `A persisted candidate must be reused after downstream failure. Authenticate candidate and receipt artifacts before retry; reported selectors alone are not proof. Caches are not release evidence.`;
            await core.summary.addRaw(body).write();
            if (failed) {
              const title = 'Funding Finder release checkpoint failed';
              const {data: issues} = await github.rest.issues.listForRepo({...context.repo, state:'open', per_page:100});
              const existing = issues.find(issue => !issue.pull_request && issue.title === title);
              if (existing) await github.rest.issues.update({...context.repo, issue_number:existing.number, body});
              else await github.rest.issues.create({...context.repo, title, body});
            } else if (needs['verify-live'].result === 'success') {
              const {data: issues} = await github.rest.issues.listForRepo({...context.repo, state:'open', per_page:100});
              const recovered = new Set(['Funding Finder release checkpoint failed', 'Automated Grants.gov refresh failed']);
              if (needs.generate.outputs.sources_healthy === 'true') recovered.add('External funding source refresh degraded');
              for (const issue of issues.filter(issue => !issue.pull_request && recovered.has(issue.title))) {
                await github.rest.issues.update({...context.repo, issue_number:issue.number, state:'closed', state_reason:'completed',
                  body: body + '\n\nRecovered after exact live verification. A source disabled for documented upstream unavailability is not represented as healthy.'});
              }
            }
