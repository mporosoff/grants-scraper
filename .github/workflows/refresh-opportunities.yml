name: Refresh Grants.gov opportunities

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/refresh-opportunities.yml"
      - "requirements.txt"
      - "scripts/build_catalog.py"
      - "scripts/enrich_catalog.py"
      - "scripts/extract_document_evidence.py"
      - "scripts/faculty_match.py"
      - "scripts/import_hajim_faculty.py"
      - "config/hajim_faculty.json"
      - "config/cheme_team_match_profiles.json"
      - "assets/hajim-faculty.js"
      - "assets/hajim-reverse-match.js"
      - "tests/test_faculty_match.py"
      - "tests/test_import_hajim_faculty.py"
      - "tests/browser/hajim-reverse-match-contract.test.mjs"
      - "scripts/program_areas.py"
      - "scripts/sources/**"
      - "scripts/update_catalog_docs.py"
      - "scripts/build_feeds.py"
      - "scripts/build_changes.py"
      - "scripts/check_links.py"
      - "scripts/currentness.py"
      - "scripts/alert_match.py"
      - "tools/run_refresh_validation.py"
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:
    inputs:
      premerge_candidate:
        description: Run only the protected pre-merge Worker candidate smoke
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: write

concurrency:
  group: funding-finder-coordinated-release
  cancel-in-progress: false

jobs:
  release-candidate-worker:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.premerge_candidate }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: python -m pip install -r requirements.txt
      - name: Verify the committed search package
        run: node tools/build_search_release_package.mjs --check
      - name: Run the complete Python product gate
        run: python -c "from tools.run_refresh_validation import main; raise SystemExit(main())"
      - name: Run browser, package, and frozen quality gates
        run: >-
          node --test tests/browser/*.test.mjs &&
          node tools/query_baseline.mjs --check &&
          node tools/p9_scoring_probe.mjs --check
      - name: Capture and verify the protected main release base
        id: candidate-base
        shell: bash
        run: |
          git fetch --no-tags origin main
          current_main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          candidate_base_sha="$(git merge-base HEAD origin/main)"
          if [ -z "$current_main_sha" ] || [ "$candidate_base_sha" != "$current_main_sha" ]; then
            echo "::error::The candidate was not built from current protected main."
            exit 1
          fi
          echo "main_sha=$current_main_sha" >> "$GITHUB_OUTPUT"
      - name: Capture the active Worker version for rollback
        id: candidate-prior-worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          deployments="$(npx --yes wrangler@4.125.0 deployments list \
            --config workers/search-voyage-proxy/wrangler.jsonc --json)"
          prior_version="$(jq -er '
            map(select(any(.versions[]?; (.percentage // 0) > 0)))
            | sort_by([(.created_on // ""), (.id // "")])
            | last
            | .versions as $versions
            | (($versions | map(select((.percentage // 0) == 100)) | first)
              // ($versions | map(select((.percentage // 0) > 0)) | max_by(.percentage)))
            | .version_id
          ' <<<"$deployments")"
          echo "version_id=$prior_version" >> "$GITHUB_OUTPUT"
          echo "Prior Worker rollback version: \`$prior_version\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy the pre-merge compatibility Worker
        id: candidate-worker-deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.125.0 deploy --config workers/search-voyage-proxy/wrangler.jsonc
      - name: Capture the candidate Worker version
        id: candidate-worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          deployments="$(npx --yes wrangler@4.125.0 deployments list \
            --config workers/search-voyage-proxy/wrangler.jsonc --json)"
          candidate_version="$(jq -er '
            map(select(any(.versions[]?; (.percentage // 0) > 0)))
            | sort_by([(.created_on // ""), (.id // "")])
            | last
            | .versions as $versions
            | (($versions | map(select((.percentage // 0) == 100)) | first)
              // ($versions | map(select((.percentage // 0) > 0)) | max_by(.percentage)))
            | .version_id
          ' <<<"$deployments")"
          echo "version_id=$candidate_version" >> "$GITHUB_OUTPUT"
          echo "Candidate Worker version: \`$candidate_version\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Wait for the candidate Worker identity
        id: candidate-worker-handshake
        shell: bash
        run: |
          candidate_sha="$(jq -r '.current_corpus_sha256' data/search-v2-release.json)"
          candidate_fingerprint="$(jq -r '.model_space_fingerprint' data/search-v2-release.json)"
          health=""
          for attempt in {1..12}; do
            health="$(curl --fail --silent --show-error --max-time 10 \
              -H 'Origin: https://mporosoff.github.io' \
              'https://funding-finder-voyage-search.urochestercheme.workers.dev/health' || true)"
            if test "$(jq -r '.service // empty' <<<"$health" 2>/dev/null)" = "available" \
              && test "$(jq -r '.budget_state // empty' <<<"$health" 2>/dev/null)" = "available" \
              && test "$(jq -r '.corpus_sha256 // empty' <<<"$health" 2>/dev/null)" = "$candidate_sha" \
              && test "$(jq -r '.model_space_fingerprint // empty' <<<"$health" 2>/dev/null)" = "$candidate_fingerprint"; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::The candidate Worker identity did not become available."
          exit 1
      - name: Run the corrected real-provider smoke
        id: candidate-worker-smoke
        run: node ./tools/smoke_search_worker.mjs
      - name: Restore the prior Worker if candidate smoke fails
        if: ${{ always() && steps.candidate-worker-deploy.outcome == 'success' && (steps.candidate-worker-handshake.outcome == 'failure' || steps.candidate-worker-smoke.outcome == 'failure') }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4.125.0 rollback
          "${{ steps.candidate-prior-worker.outputs.version_id }}"
          --config workers/search-voyage-proxy/wrangler.jsonc
          --message "Automatic rollback after pre-merge Worker smoke failure"
      - name: Restore the prior Worker if protected main advanced
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          current_main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ -z "$current_main_sha" ] || [ "$current_main_sha" != "${{ steps.candidate-base.outputs.main_sha }}" ]; then
            npx --yes wrangler@4.125.0 rollback \
              "${{ steps.candidate-prior-worker.outputs.version_id }}" \
              --config workers/search-voyage-proxy/wrangler.jsonc \
              --message "Automatic rollback because main advanced after pre-merge Worker smoke"
            echo "::error::Main advanced after Worker smoke; the prior Worker was restored."
            exit 1
          fi
      - name: Record successful pre-merge candidate smoke
        run: |
          echo "Pre-merge candidate Worker smoke passed." >> "$GITHUB_STEP_SUMMARY"
          echo "Protected main base: \`${{ steps.candidate-base.outputs.main_sha }}\`" >> "$GITHUB_STEP_SUMMARY"

  refresh:
    if: ${{ github.event_name != 'workflow_dispatch' || ! inputs.premerge_candidate }}
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v6
        with:
          # Scheduled events can wait behind another refresh while retaining
          # the SHA captured when queued. Always build current protected main.
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.19.0"
      - name: Preserve the prior catalog for change detection
        shell: bash
        run: cp data/opportunities.js "$RUNNER_TEMP/opportunities.previous.js"
      - run: python -m pip install -r requirements.txt
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Test live product before refresh
        run: python -m tools.run_refresh_validation
      - name: Test canonical browser application
        run: node --test tests/browser/*.test.mjs
      - name: Build and validate complete public opportunity catalog
        run: >-
          python -m scripts.build_catalog
          --output data/opportunities.js
          --min-records 1000
          --max-record-count 5000
      - name: Enrich new or changed records with official detail evidence
        run: >-
          python -m scripts.enrich_catalog
          --catalog data/opportunities.js
          --cache data/opportunity_enrichment.json
          --max-updates 250
          --request-delay 0.25
      - name: Extract citation-backed facts from official notices
        id: document_evidence
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: >-
          python -m scripts.extract_document_evidence
          --catalog data/opportunities.js
          --cache data/document_evidence.json
          --max-documents 45
          --max-subtopic-documents 30
          --request-delay 0.2
          --recheck-days 14
          --enable-subtopics
      - name: Merge additional (non-Grants.gov) sources
        id: additional-sources
        continue-on-error: true
        env:
          VPR_IMAP_HOST: imap.gmail.com
          VPR_IMAP_USER: ${{ secrets.VPR_IMAP_USER }}
          VPR_IMAP_PASS: ${{ secrets.VPR_IMAP_PASS }}
          VPR_SENDER: VPR_Funding_Opps@lists.rochester.edu
          VPR_LOOKBACK_DAYS: "45"
          VPR_REQUIRED_STREAMS: "vpr,cindy"
          VPR_ENRICH_LINKS: "true"
        run: >-
          python -m scripts.sources merge
          --catalog data/opportunities.js
          --cache data/source_records.json
          --write
          --summary-output "${{ runner.temp }}/source-refresh-summary.json"
          --fail-on-degraded
      - name: Build deadline, amendment, closing-soon, and closure events
        run: >-
          python -m scripts.build_changes
          --previous "${{ runner.temp }}/opportunities.previous.js"
          --current data/opportunities.js
          --out feeds
      - name: Rotate through official links and record health and redirects
        run: >-
          python -m scripts.check_links
          --catalog data/opportunities.js
          --state data/link_health.json
          --max-checks 150
          --workers 8
          --fail-threshold 0.35
      - name: Rebuild Hajim faculty directory and match graph atomically
        run: >-
          python -m scripts.faculty_match match
          --catalog data/opportunities.js
          --faculty-config config/hajim_faculty.json
          --curated-cheme-config config/cheme_team_match_profiles.json
          --directory-out data/hajim_faculty_directory.js
          --out data/faculty_matches.js
          --version-target match_explorer.html
          --version-target team_match.html
      - name: Generate static RSS/Atom feeds from the final catalog
        run: python -m scripts.build_feeds --catalog data/opportunities.js --out feeds
      - name: Regenerate catalog statistics in project documentation
        run: python -m scripts.update_catalog_docs
      - name: Rebuild every production document vector
        id: semantic-vectors
        env:
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
        run: node tools/build_search_v2_voyage_vectors.mjs --production --write
      - name: Build the current/previous Worker compatibility package
        id: search-package
        run: node tools/build_search_release_package.mjs --write
      - name: Verify the complete search package is internally consistent
        id: package-integrity
        run: node tools/build_search_release_package.mjs --check
      - name: Run regression tests against generated asset
        id: product-regression
        run: python -m tools.run_refresh_validation
      - name: Run browser and search-package regression gates
        id: browser-regression
        run: >-
          node --test tests/browser/*.test.mjs &&
          node tools/query_baseline.mjs --check &&
          node tools/p9_scoring_probe.mjs --check
      - name: Run real-browser product and accessibility gates
        id: e2e-regression
        run: pnpm test:e2e
      - name: Refuse to deploy a stale generation
        shell: bash
        run: |
          built_from_sha="$(git rev-parse HEAD)"
          current_main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ -z "$current_main_sha" ]; then
            echo "::error::Could not resolve the current main SHA." >&2
            exit 1
          fi
          if [ "$built_from_sha" != "$current_main_sha" ]; then
            echo "::error::Main changed while this generation was building; refusing to deploy stale Worker or Pages assets." >&2
            echo "Built from: $built_from_sha" >&2
            echo "Current main: $current_main_sha" >&2
            exit 1
          fi
      - name: Capture the active Worker version for rollback
        id: prior-worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          deployments="$(npx --yes wrangler@4.125.0 deployments list \
            --config workers/search-voyage-proxy/wrangler.jsonc --json)"
          prior_version="$(jq -er '
            map(select(any(.versions[]?; (.percentage // 0) > 0)))
            | sort_by([(.created_on // ""), (.id // "")])
            | last
            | .versions as $versions
            | (($versions | map(select((.percentage // 0) == 100)) | first)
              // ($versions | map(select((.percentage // 0) > 0)) | max_by(.percentage)))
            | .version_id
          ' <<<"$deployments")"
          echo "version_id=$prior_version" >> "$GITHUB_OUTPUT"
          echo "Captured the active Worker version for rollback."
      - name: Deploy the compatibility Worker before publishing Pages assets
        id: worker-deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.125.0 deploy --config workers/search-voyage-proxy/wrangler.jsonc
      - name: Verify the deployed Worker recognizes the candidate corpus
        id: worker-handshake
        shell: bash
        run: |
          candidate_sha="$(jq -r '.current_corpus_sha256' data/search-v2-release.json)"
          candidate_fingerprint="$(jq -r '.model_space_fingerprint' data/search-v2-release.json)"
          health=""
          for attempt in {1..12}; do
            health="$(curl --fail --silent --show-error --max-time 10 \
              -H 'Origin: https://mporosoff.github.io' \
              'https://funding-finder-voyage-search.urochestercheme.workers.dev/health' || true)"
            if test "$(jq -r '.service // empty' <<<"$health" 2>/dev/null)" = "available" \
              && test "$(jq -r '.budget_state // empty' <<<"$health" 2>/dev/null)" = "available" \
              && test "$(jq -r '.corpus_sha256 // empty' <<<"$health" 2>/dev/null)" = "$candidate_sha" \
              && test "$(jq -r '.model_space_fingerprint // empty' <<<"$health" 2>/dev/null)" = "$candidate_fingerprint"; then
              echo "Worker candidate handshake passed on attempt ${attempt}."
              exit 0
            fi
            echo "Worker candidate generation is still propagating (attempt ${attempt}/12)."
            sleep 5
          done
          echo "Expected corpus: $candidate_sha" >&2
          echo "Observed corpus: $(jq -r '.corpus_sha256 // "unavailable"' <<<"$health" 2>/dev/null)" >&2
          echo "Expected model fingerprint: $candidate_fingerprint" >&2
          echo "Observed model fingerprint: $(jq -r '.model_space_fingerprint // "unavailable"' <<<"$health" 2>/dev/null)" >&2
          exit 1
      - name: Run a real provider smoke against the candidate Worker
        id: worker-smoke
        run: node tools/smoke_search_worker.mjs
      - name: Restore the prior Worker if pre-publication smoke fails
        if: ${{ always() && steps.worker-deploy.outcome == 'success' && (steps.worker-handshake.outcome == 'failure' || steps.worker-smoke.outcome == 'failure') }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4.125.0 rollback
          "${{ steps.prior-worker.outputs.version_id }}"
          --config workers/search-voyage-proxy/wrangler.jsonc
          --message "Automatic rollback after candidate Worker smoke failure"
      - name: Recheck main after Worker smoke
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          built_from_sha="$(git rev-parse HEAD)"
          current_main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ -z "$current_main_sha" ] || [ "$built_from_sha" != "$current_main_sha" ]; then
            npx --yes wrangler@4.125.0 rollback \
              "${{ steps.prior-worker.outputs.version_id }}" \
              --config workers/search-voyage-proxy/wrangler.jsonc \
              --message "Automatic rollback because main advanced after Worker smoke"
            echo "::error::Main advanced after Worker smoke; the prior Worker was restored."
            exit 1
          fi
      - name: Record the build heartbeat
        shell: bash
        # Scheduled workflows are disabled after 60 days without repository
        # activity, and diff-stable serialization means a quiet stretch can
        # produce no commit at all -- so the schedule can lapse with no error
        # anywhere. Writing this unconditionally guarantees one commit per
        # successful run. Nothing reads it. See docs/TOPIC_LAYER_PLAN.md §16.3.
        run: date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last_build
      - name: Recheck main immediately before refresh publication
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          built_from_sha="$(git rev-parse HEAD)"
          current_main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ -z "$current_main_sha" ] || [ "$built_from_sha" != "$current_main_sha" ]; then
            npx --yes wrangler@4.125.0 rollback \
              "${{ steps.prior-worker.outputs.version_id }}" \
              --config workers/search-voyage-proxy/wrangler.jsonc \
              --message "Automatic rollback because main advanced before refresh publication"
            echo "::error::Main advanced before refresh publication; the prior Worker was restored."
            exit 1
          fi
      - name: Commit refreshed catalog through pull request
        id: publish-pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # data/subtopics.js is paired with its !/data/ allowlist
          # line in .gitignore. `git add` on an ignored path exits non-zero and
          # this step runs under bash -eo pipefail, so a missing allowlist line
          # would abort the commit and stop the nightly publishing entirely.
          # The file does not exist until --enable-subtopics is on, so the path
          # is passed through git ls-files to stay a no-op until then.
          git add README.md PROJECT.md match_explorer.html team_match.html data/opportunities.js data/catalog-metadata.js data/opportunity_enrichment.json data/document_evidence.json data/source_records.json data/hajim_faculty_directory.js data/faculty_matches.js data/link_health.json data/search-v2-voyage-manifest.json data/search-v2-voyage-vectors.f16 data/search-v2-voyage-canaries.json data/search-v2-release.json evaluation/search_v2_hybrid_vector_build.json workers/search-voyage-proxy/generated/corpus-allowlist.json feeds .github/last_build
          if [ -f data/subtopics.js ]; then
            git add data/subtopics.js
          fi
          if git diff --cached --quiet; then
            echo "::error::The build heartbeat should make every successful refresh publishable."
            exit 1
          fi
          git commit -m "chore: refresh Grants.gov catalog"
          refresh_branch="automation/refresh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git branch -M "$refresh_branch"
          if ! git push origin "HEAD:refs/heads/${refresh_branch}"; then
            npx --yes wrangler@4.125.0 rollback \
              "${{ steps.prior-worker.outputs.version_id }}" \
              --config workers/search-voyage-proxy/wrangler.jsonc \
              --message "Automatic rollback after refresh branch push failure"
            exit 1
          fi

          head_sha="$(git rev-parse HEAD)"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${head_sha}" \
            -f state=success \
            -f context=python \
            -f description='Refresh Python gate passed' \
            -f target_url="$run_url"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${head_sha}" \
            -f state=success \
            -f context=browser \
            -f description='Refresh browser/search gate passed' \
            -f target_url="$run_url"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${head_sha}" \
            -f state=success \
            -f context=e2e \
            -f description='Refresh Chromium/accessibility gate passed' \
            -f target_url="$run_url"

          if ! pr_url="$(gh pr create \
              --base main \
              --head "$refresh_branch" \
              --title 'chore: refresh Grants.gov catalog' \
              --body "Automated coordinated refresh from [run ${GITHUB_RUN_ID}](${run_url}). The exact generated commit passed the complete Python, browser, Chromium/accessibility, search-quality, Worker, and stale-generation gates before this pull request was created.")"; then
            npx --yes wrangler@4.125.0 rollback \
              "${{ steps.prior-worker.outputs.version_id }}" \
              --config workers/search-voyage-proxy/wrangler.jsonc \
              --message "Automatic rollback after refresh pull-request creation failure"
            exit 1
          fi
          if ! gh pr merge "$pr_url" --squash --delete-branch; then
            current_main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
            echo "Refresh merge failed; current main is ${current_main_sha:-unresolved}."
            npx --yes wrangler@4.125.0 rollback \
              "${{ steps.prior-worker.outputs.version_id }}" \
              --config workers/search-voyage-proxy/wrangler.jsonc \
              --message "Automatic rollback after refresh merge failure"
            exit 1
          fi
          merge_sha="$(gh pr view "$pr_url" --json mergeCommit --jq '.mergeCommit.oid')"
          if [ -z "$merge_sha" ] || [ "$merge_sha" = "null" ]; then
            echo "::error::The refresh pull request did not produce a main-branch merge commit."
            exit 1
          fi
          echo "merge_sha=$merge_sha" >> "$GITHUB_OUTPUT"
      - name: Verify GitHub Pages serves the coordinated search package
        id: pages-verify
        if: success()
        shell: bash
        run: |
          candidate_sha="$(jq -r '.current_corpus_sha256' data/search-v2-release.json)"
          candidate_release="$(jq -S -c . data/search-v2-release.json)"
          verified=false
          for attempt in $(seq 1 18); do
            live_release="$(curl --fail --silent --show-error --max-time 15 \
              "https://mporosoff.github.io/grants-scraper/data/search-v2-release.json?candidate=${candidate_sha}" \
              || true)"
            live_release="$(jq -S -c . <<<"$live_release" 2>/dev/null || true)"
            if [ "$live_release" = "$candidate_release" ]; then
              verified=true
              break
            fi
            sleep 10
          done
          if [ "$verified" != "true" ]; then
            echo "::error::GitHub Pages did not serve candidate corpus ${candidate_sha} within the verification window."
            exit 1
          fi
          candidate_metadata="$(cat data/catalog-metadata.js)"
          live_metadata="$(curl --fail --silent --show-error --max-time 15 \
            "https://mporosoff.github.io/grants-scraper/data/catalog-metadata.js?candidate=${candidate_sha}")"
          if [ "$live_metadata" != "$candidate_metadata" ]; then
            echo "::error::GitHub Pages served catalog metadata from a different generation."
            exit 1
          fi
          catalog_url="$(sed -n 's/^globalThis.GRANT_CATALOG_METADATA=//p' data/catalog-metadata.js | sed 's/;$//' | jq -r '.catalog_url')"
          expected_catalog_sha="$(jq -r '.source_hashes["data/opportunities.js"]' data/search-v2-release.json)"
          live_catalog_sha="$(curl --fail --silent --show-error --max-time 45 \
            "https://mporosoff.github.io/grants-scraper/${catalog_url#./}" | sha256sum | awk '{print $1}')"
          if [ "$live_catalog_sha" != "$expected_catalog_sha" ]; then
            echo "::error::GitHub Pages catalog bytes do not match the metadata/release generation."
            exit 1
          fi
          runtime_verified=false
          for attempt in $(seq 1 18); do
            live_funded="$(curl --fail --silent --show-error --max-time 15 \
              "https://mporosoff.github.io/grants-scraper/funded_awards.html?runtime=${GITHUB_SHA}" \
              || true)"
            live_finder="$(curl --fail --silent --show-error --max-time 15 \
              "https://mporosoff.github.io/grants-scraper/match_explorer.html?runtime=${GITHUB_SHA}" \
              || true)"
            live_team="$(curl --fail --silent --show-error --max-time 15 \
              "https://mporosoff.github.io/grants-scraper/team_match.html?runtime=${GITHUB_SHA}" \
              || true)"
            coherent=true
            while IFS=$'\t' read -r asset cache_key expected_sha; do
              live_sha="$(curl --fail --silent --show-error --max-time 30 \
                "https://mporosoff.github.io/grants-scraper/${asset}?v=${cache_key}" \
                | sha256sum | awk '{print $1}' || true)"
              if [ "$live_sha" != "$expected_sha" ]; then
                coherent=false
                break
              fi
              case "$asset" in
                assets/app.css|assets/site-help.js)
                  grep -Fq "${asset}?v=${cache_key}" <<<"$live_funded" \
                    && grep -Fq "${asset}?v=${cache_key}" <<<"$live_finder" \
                    && grep -Fq "${asset}?v=${cache_key}" <<<"$live_team" \
                    || coherent=false
                  ;;
                assets/search-query.js|assets/search-retrieval.js|assets/hajim-faculty.js)
                  grep -Fq "${asset}?v=${cache_key}" <<<"$live_finder" \
                    && grep -Fq "${asset}?v=${cache_key}" <<<"$live_team" \
                    || coherent=false
                  ;;
                assets/app.js|assets/hajim-reverse-match.js)
                  grep -Fq "${asset}?v=${cache_key}" <<<"$live_finder" || coherent=false
                  ;;
                assets/team-researchers.js|assets/team-match-config.js|assets/team-matcher.js)
                  grep -Fq "${asset}?v=${cache_key}" <<<"$live_team" || coherent=false
                  ;;
                *)
                  coherent=false
                  ;;
              esac
              [ "$coherent" = "true" ] || break
            done < <(jq -r '. as $release | $release.runtime_cache_keys | to_entries[] | [.key, .value, $release.source_hashes[.key]] | @tsv' data/search-v2-release.json)
            if [ "$coherent" = "true" ]; then
              runtime_verified=true
              break
            fi
            sleep 10
          done
          if [ "$runtime_verified" != "true" ]; then
            echo "::error::GitHub Pages served mismatched runtime HTML, cache identities, or bytes."
            exit 1
          fi
          faculty_generation="$(sed -n 's/.*<meta name="hajim-match-generation" content="\([a-f0-9]\{64\}\)".*/\1/p' match_explorer.html)"
          team_faculty_generation="$(sed -n 's/.*<meta name="hajim-match-generation" content="\([a-f0-9]\{64\}\)".*/\1/p' team_match.html)"
          if [ -z "$faculty_generation" ] || [ "$team_faculty_generation" != "$faculty_generation" ]; then
            echo "::error::Published pages do not share one valid Hajim faculty generation marker."
            exit 1
          fi
          expected_directory_sha="$(sha256sum data/hajim_faculty_directory.js | awk '{print $1}')"
          expected_graph_sha="$(sha256sum data/faculty_matches.js | awk '{print $1}')"
          faculty_verified=false
          for attempt in $(seq 1 18); do
            live_finder="$(curl --fail --silent --show-error --max-time 15 \
              "https://mporosoff.github.io/grants-scraper/match_explorer.html?faculty=${faculty_generation}" \
              || true)"
            live_team="$(curl --fail --silent --show-error --max-time 15 \
              "https://mporosoff.github.io/grants-scraper/team_match.html?faculty=${faculty_generation}" \
              || true)"
            live_directory_sha="$(curl --fail --silent --show-error --max-time 30 \
              "https://mporosoff.github.io/grants-scraper/data/hajim_faculty_directory.js?v=${faculty_generation}" \
              | sha256sum | awk '{print $1}' || true)"
            live_graph_sha="$(curl --fail --silent --show-error --max-time 30 \
              "https://mporosoff.github.io/grants-scraper/data/faculty_matches.js?v=${faculty_generation}" \
              | sha256sum | awk '{print $1}' || true)"
            if grep -Fq "<meta name=\"hajim-match-generation\" content=\"${faculty_generation}\"" <<<"$live_finder" \
              && grep -Fq "<meta name=\"hajim-match-generation\" content=\"${faculty_generation}\"" <<<"$live_team" \
              && grep -Fq "data/hajim_faculty_directory.js?v=${faculty_generation}" <<<"$live_team" \
              && [ "$live_directory_sha" = "$expected_directory_sha" ] \
              && [ "$live_graph_sha" = "$expected_graph_sha" ]; then
              faculty_verified=true
              break
            fi
            sleep 10
          done
          if [ "$faculty_verified" != "true" ]; then
            echo "::error::GitHub Pages did not serve the coordinated Hajim faculty generation ${faculty_generation}."
            exit 1
          fi
      - name: Run a real provider smoke after Pages propagation
        id: pages-worker-smoke
        run: node tools/smoke_search_worker.mjs
      - name: Resolve recovered refresh alerts
        if: >-
          success() &&
          steps.additional-sources.outcome == 'success' &&
          steps.document_evidence.outcome == 'success'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("fs");
            const titles = new Set([
              "Automated Grants.gov refresh failed",
              "External funding source refresh degraded",
            ]);
            const runUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`;
            let disabledEvidence = "";
            try {
              const summaryPath = `${process.env.RUNNER_TEMP}/source-refresh-summary.json`;
              const summary = JSON.parse(fs.readFileSync(summaryPath, "utf8"));
              const disabled = (summary.disabled_sources || []).map(source =>
                `- **${source.source}** (\`${source.slug}\`): ${source.reason}; ` +
                `publication decision \`${source.publication_decision}\`.`
              );
              if (disabled.length) {
                disabledEvidence =
                  `\n\nDocumented disabled-source limitations:\n${disabled.join("\n")}`;
              }
            } catch (error) {
              core.warning(`Could not read disabled-source evidence: ${error.message}`);
            }
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            for (const issue of issues.filter(
              item => !item.pull_request && titles.has(item.title)
            )) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body:
                  `Recovered: the refresh completed with all enabled external-source and ` +
                  `document-evidence layers healthy on ${new Date().toISOString()}. ` +
                  `A source disabled for documented upstream unavailability is not ` +
                  `represented as healthy.\n\nVerified run: ${runUrl}${disabledEvidence}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
                state_reason: "completed",
              });
            }
      - name: Alert the project owner about a degraded external source
        if: >-
          always() &&
          (steps.additional-sources.outcome == 'failure' ||
          steps.document_evidence.outcome == 'failure')
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("fs");
            const title = "External funding source refresh degraded";
            const runUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`;
            const externalDegraded =
              "${{ steps.additional-sources.outcome }}" === "failure";
            const documentEvidenceDegraded =
              "${{ steps.document_evidence.outcome }}" === "failure";
            const affected = [
              externalDegraded ? "external sources" : null,
              documentEvidenceDegraded ? "document evidence/subtopic classification" : null,
            ].filter(Boolean).join(", ");
            let sourceEvidence = "- Structured source evidence was unavailable; inspect the run log.";
            try {
              const summaryPath = `${process.env.RUNNER_TEMP}/source-refresh-summary.json`;
              const summary = JSON.parse(fs.readFileSync(summaryPath, "utf8"));
              const degraded = (summary.sources || []).filter(
                source => !["refreshed", "recent_snapshot"].includes(source.status)
              );
              const validation = summary.validation || {};
              if (degraded.length) {
                sourceEvidence = degraded.map(source => {
                  const lastSuccess = source.last_successful_refresh_at
                    || "none under the current verified contract";
                  const retainedAge = Number.isInteger(source.retained_data_age_days)
                    ? `${source.retained_data_age_days} day(s)`
                    : "not applicable (no retained records published)";
                  return `- **${source.source}** (\`${source.slug}\`): ` +
                    `failure class \`${source.failure_class || "unknown"}\`; ` +
                    `last successful refresh ${lastSuccess}; retained-data age ${retainedAge}; ` +
                    `publication decision \`${source.publication_decision || "unknown"}\`.`;
                }).join("\n");
              } else if (validation.ok === false) {
                const validationError = String(
                  validation.error || "post-merge catalog validation failed"
                ).slice(0, 500);
                sourceEvidence =
                  `- External-source post-merge validation failed: ${validationError}`;
              } else if (documentEvidenceDegraded) {
                sourceEvidence = "- All external sources were healthy; degradation was confined to document evidence/classification.";
              } else {
                sourceEvidence =
                  "- The external-source step failed without a degraded adapter or validation detail; inspect the run log.";
              }
            } catch (error) {
              core.warning(`Could not read structured source summary: ${error.message}`);
            }
            const body =
              `The degraded refresh layer(s) were: ${affected}. ` +
              `This occurred on ${new Date().toISOString()}.\n\n` +
              `Healthy sources were still refreshed. Sources configured to retain ` +
              `last-known-good data kept only publishable records; fail-closed sources ` +
              `published zero. Document-evidence or classifier degradation cannot ` +
              `publish unchecked generic children.\n\nSource health evidence:\n${sourceEvidence}` +
              `\n\nInspect the run summary: ${runUrl}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "all",
              sort: "updated",
              direction: "desc",
              per_page: 100,
            });
            const existing = issues.find(
              issue => !issue.pull_request && issue.title === title
            );
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
                state: "open",
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
      - name: Alert the project owner
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("fs");
            const title = "Automated Grants.gov refresh failed";
            const runUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`;
            const outcomes = [
              ["semantic vector build", "${{ steps.semantic-vectors.outcome }}"],
              ["search package build", "${{ steps.search-package.outcome }}"],
              ["package integrity", "${{ steps.package-integrity.outcome }}"],
              ["product regression", "${{ steps.product-regression.outcome }}"],
              ["browser regression", "${{ steps.browser-regression.outcome }}"],
              ["Chromium/accessibility regression", "${{ steps.e2e-regression.outcome }}"],
              ["Worker deployment", "${{ steps.worker-deploy.outcome }}"],
              ["Worker package handshake", "${{ steps.worker-handshake.outcome }}"],
              ["Worker provider smoke", "${{ steps.worker-smoke.outcome }}"],
              ["Pages handshake", "${{ steps.pages-verify.outcome }}"],
              ["post-Pages Worker provider smoke", "${{ steps.pages-worker-smoke.outcome }}"],
            ];
            const failingStage = outcomes.find(([, outcome]) => outcome === "failure")?.[0]
              || "an earlier catalog/source stage";
            let candidateCorpus = "not generated";
            try {
              candidateCorpus = JSON.parse(fs.readFileSync("data/search-v2-release.json", "utf8"))
                .current_corpus_sha256;
            } catch {}
            let lastLiveCorpus = "unknown";
            try {
              const { data } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: "data/search-v2-release.json",
                ref: "main",
              });
              lastLiveCorpus = JSON.parse(Buffer.from(data.content, "base64").toString("utf8"))
                .current_corpus_sha256;
            } catch {}
            const body =
              `The scheduled opportunity refresh failed during **${failingStage}** on ` +
              `${new Date().toISOString()}.\n\n` +
              `- Workflow: ${runUrl}\n` +
              `- Last committed live corpus: \`${lastLiveCorpus}\`\n` +
              `- Candidate corpus: \`${candidateCorpus}\`\n` +
              `- Public-site state: ${failingStage === "Pages handshake" ? "candidate push completed; Pages propagation was not verified" : "the prior package remains authoritative; no candidate commit was published"}\n\n` +
              `Fix or rerun the named stage. Do not publish the catalog separately from its vectors and Worker allowlist.`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "all",
              sort: "updated",
              direction: "desc",
              per_page: 100,
            });
            const existing = issues.find(
              issue => !issue.pull_request && issue.title === title
            );
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
                state: "open",
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
