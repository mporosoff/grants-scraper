name: Tests

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Test live product without redrawing closed measurement frames
        run: python -m tools.run_refresh_validation
      - name: Verify flag-off output has not drifted
        run: bash tools/verify_no_drift.sh

  browser:
    runs-on: ubuntu-latest
    env:
      RESEARCHER_IDENTITY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

    steps:
      - uses: actions/checkout@v6
      - name: Fetch the protected researcher identity baseline
        shell: bash
        run: |
          if ! [[ "$RESEARCHER_IDENTITY_BASE_SHA" =~ ^[a-f0-9]{40}$ ]] || [[ "$RESEARCHER_IDENTITY_BASE_SHA" =~ ^0+$ ]]; then
            echo "::error::A protected base commit is required for researcher identity validation."
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "$RESEARCHER_IDENTITY_BASE_SHA"
      - uses: pnpm/action-setup@v6
        with:
          version: "11.19.0"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --check assets/app.js
      - run: node --check assets/catalog-loader.js
      - run: node --check assets/profile.js
      - run: node --check assets/credentials.js
      - run: node --check assets/review.js
      - run: node --check assets/ai-provider.js
      - run: node --check assets/chat-ui.js
      - run: node --test tests/browser/*.test.mjs
      - name: Verify retrieval has not regressed on the frozen query set
        run: node tools/query_baseline.mjs --check
      - name: Verify frozen P9 cross-corpus scoring prototype
        run: node tools/p9_scoring_probe.mjs --check
