name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  browser:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: node --check assets/app.js
      - run: node --check assets/profile.js
      - run: node --check assets/credentials.js
      - run: node --check assets/review.js
      - run: node --check assets/ai-provider.js
      - run: node --check assets/chat-ui.js
      - run: node --test tests/browser/*.test.mjs
