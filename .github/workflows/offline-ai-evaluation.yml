name: Bounded offline AI evaluation

on:
  workflow_dispatch:
    inputs:
      phase:
        description: One frozen phase within the shared $15 logical evaluation
        required: true
        type: choice
        options: [production-preflight, production-teams-regression, production-teams-population, production-teams-confirmation, production-teams-replay, preflight, teams-sonnet, teams-luna, teams-luna-sonnet-verifier, teams-mini, cov4, stability, replay, round2-sonnet, round2-luna, round2-stability, round2-replay, recovery-sonnet, cov4-sonnet, recovery-replay, scope-repair-sonnet, scope-repair-replay, verification-sonnet, verification-replay]
        default: preflight
      authorize_anthropic_baseline:
        description: Consume the user's one evaluation-only Sonnet baseline authorization; production pause stays intact
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: funding-finder-offline-evaluation-economical-ai-20260908
  cancel-in-progress: false

jobs:
  evaluate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Restore authoritative spend state before reserving further work
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -m tools.offline_ai_checkpoint --state "$RUNNER_TEMP/offline-ai"
          --reservation "$RUNNER_TEMP/reservation.json"
      - name: Persist whole-logical-budget crash protection before any provider call
        uses: actions/upload-artifact@v4
        with:
          name: offline-ai-economical-ai-20260908-reservation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reservation.json
          if-no-files-found: error
          retention-days: 90
      - name: Run the selected finite evaluation with provider-specific credentials
        env:
          EVALUATION_PHASE: ${{ inputs.phase }}
          OPENAI_API_KEY: ${{ !startsWith(inputs.phase, 'production-') && inputs.phase != 'teams-sonnet' && inputs.phase != 'round2-sonnet' && inputs.phase != 'replay' && inputs.phase != 'round2-replay' && inputs.phase != 'recovery-sonnet' && inputs.phase != 'cov4-sonnet' && inputs.phase != 'recovery-replay' && inputs.phase != 'scope-repair-sonnet' && inputs.phase != 'scope-repair-replay' && inputs.phase != 'verification-sonnet' && inputs.phase != 'verification-replay' && secrets.OPENAI_API_KEY || '' }}
          ANTHROPIC_API_KEY: ${{ ((startsWith(inputs.phase, 'production-') && !endsWith(inputs.phase, '-replay')) || inputs.phase == 'teams-sonnet' || inputs.phase == 'teams-luna-sonnet-verifier' || inputs.phase == 'stability' || inputs.phase == 'round2-sonnet' || inputs.phase == 'recovery-sonnet' || inputs.phase == 'cov4-sonnet' || inputs.phase == 'scope-repair-sonnet' || inputs.phase == 'verification-sonnet') && secrets.ANTHROPIC_API_KEY || '' }}
          AUTHORIZE_ANTHROPIC_BASELINE: ${{ inputs.authorize_anthropic_baseline && 'true' || 'false' }}
        run: |
          if [[ "$EVALUATION_PHASE" == verification-* ]]; then
            python -m tools.evaluate_sonnet_verification "$EVALUATION_PHASE" --state "$RUNNER_TEMP/offline-ai"
          elif [[ "$EVALUATION_PHASE" == recovery-* || "$EVALUATION_PHASE" == cov4-sonnet || "$EVALUATION_PHASE" == scope-repair-* ]]; then
            python -m tools.evaluate_established_sonnet "$EVALUATION_PHASE" --state "$RUNNER_TEMP/offline-ai"
          elif [[ "$EVALUATION_PHASE" == round2-* ]]; then
            python -m tools.evaluate_team_prompt_repair "$EVALUATION_PHASE" --state "$RUNNER_TEMP/offline-ai"
          else
            python -m tools.evaluate_offline_ai "$EVALUATION_PHASE" --state "$RUNNER_TEMP/offline-ai"
          fi
      - name: Preserve accounting and safe completed stage responses after any outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-ai-economical-ai-20260908-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/offline-ai
          if-no-files-found: warn
          retention-days: 90
