name: Deploy Funding Finder alerts

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-alerts.yml"
      - "assets/alerts-config.js"
      - "assets/alerts.css"
      - "assets/alerts.js"
      - "assets/award-links.js"
      - "assets/saved.js"
      - "assets/app.css"
      - "assets/app.js"
      - "assets/match-explain.js"
      - "assets/search-query.js"
      - "assets/search-retrieval.js"
      - "assets/search-v2-config.js"
      - "assets/funded-awards.js"
      - "match_explorer.html"
      - "funded_awards.html"
      - "tools/classify_worker_deployment.mjs"
      - "tools/smoke_alerts_worker.mjs"
      - "tools/validate_alert_capability_rotation.mjs"
      - "workers/alerts/**"
permissions:
  contents: read

concurrency:
  group: funding-finder-alerts-release
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Verify the bounded alert and Phase 5 release contracts
        run: >-
          node --check tools/classify_worker_deployment.mjs &&
          node --check tools/validate_alert_capability_rotation.mjs &&
          node --check assets/alerts-config.js &&
          node --check assets/alerts.js &&
          node --check assets/award-links.js &&
          node --check assets/saved.js &&
          node --check assets/app.js &&
          node --check assets/match-explain.js &&
          node --check assets/funded-awards.js &&
          node --check workers/alerts/src/contract.js &&
          node --check workers/alerts/src/crypto.js &&
          node --check workers/alerts/src/email.js &&
          node --check workers/alerts/src/evaluator.js &&
          node --check workers/alerts/src/index.js &&
          node --check workers/alerts/src/provider.js &&
          node --check workers/alerts/src/scheduler-budget.js &&
          node --check workers/alerts/src/store.js &&
          node --test tests/browser/alerts-phase2-contract.test.mjs tests/browser/alerts-phase3-contract.test.mjs tests/browser/deployment-input-classification-contract.test.mjs tests/browser/saved-contract.test.mjs tests/browser/phase5-release-contract.test.mjs
      - name: Capture and verify the protected main release base
        id: release-base
        shell: bash
        run: |
          git fetch --no-tags origin main
          built_from_sha="$(git rev-parse HEAD)"
          current_main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ -z "$current_main_sha" ] || [ "$built_from_sha" != "$current_main_sha" ]; then
            echo "::error::Protected main changed while the Alerts release was being verified."
            exit 1
          fi
          echo "main_sha=$current_main_sha" >> "$GITHUB_OUTPUT"
      - name: Classify Alerts Worker inputs since the active deployment
        id: worker-inputs
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.125.0 deployments list --config workers/alerts/wrangler.jsonc --json > /tmp/alerts-worker-deployments.json
          node tools/classify_worker_deployment.mjs alerts /tmp/alerts-worker-deployments.json "$GITHUB_SHA"
      - name: Capture the active Alerts Worker version for rollback
        id: prior-worker
        if: ${{ steps.worker-inputs.outputs.deploy_required == 'true' }}
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          deployments="$(cat /tmp/alerts-worker-deployments.json)"
          prior_version="$(jq -r '
            map(select(any(.versions[]?; (.percentage // 0) > 0)))
            | sort_by([(.created_on // ""), (.id // "")])
            | last
            | if . == null then empty
              else .versions as $versions
              | (($versions | map(select((.percentage // 0) == 100)) | first)
                // ($versions | map(select((.percentage // 0) > 0)) | max_by(.percentage)))
              | .version_id // empty
              end
          ' <<<"$deployments" 2>/dev/null || true)"
          echo "version_id=$prior_version" >> "$GITHUB_OUTPUT"
      - name: Reconfirm protected main immediately before Alerts Worker mutation
        if: ${{ steps.worker-inputs.outputs.deploy_required == 'true' }}
        shell: bash
        run: |
          current_main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ -z "$current_main_sha" ] || [ "$current_main_sha" != "${{ steps.release-base.outputs.main_sha }}" ]; then
            echo "::error::Protected main advanced before the Alerts Worker mutation."
            exit 1
          fi
      - name: Apply committed D1 migrations
        if: ${{ steps.worker-inputs.outputs.deploy_required == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.125.0 d1 migrations apply funding-finder-alerts --remote --config workers/alerts/wrangler.jsonc
      - name: Configure the Alerts capability-signing secrets
        id: capability-secrets
        if: ${{ steps.worker-inputs.outputs.deploy_required == 'true' }}
        env:
          ALERT_CAPABILITY_SECRET: ${{ secrets.ALERT_CAPABILITY_SECRET }}
          ALERT_CAPABILITY_PREVIOUS_SECRET: ${{ secrets.ALERT_CAPABILITY_PREVIOUS_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$ALERT_CAPABILITY_SECRET" ]; then
            echo "::error::ALERT_CAPABILITY_SECRET is required for stateless manage links."
            exit 1
          fi
          if [ -z "$ALERT_CAPABILITY_PREVIOUS_SECRET" ]; then
            echo "::error::ALERT_CAPABILITY_PREVIOUS_SECRET is required for safe signing-key rotation."
            exit 1
          fi
          current_key_id="$(printf '%s' "$ALERT_CAPABILITY_SECRET" | sha256sum | cut -c1-16)"
          previous_key_id="$(printf '%s' "$ALERT_CAPABILITY_PREVIOUS_SECRET" | sha256sum | cut -c1-16)"
          health_file="$(mktemp)"
          trap 'rm -f "$health_file"' EXIT
          health_status="$(curl --silent --show-error --max-time 10 \
            --output "$health_file" --write-out '%{http_code}' \
            -H 'Origin: https://mporosoff.github.io' \
            'https://funding-finder-alerts.urochestercheme.workers.dev/health')"
          if [ "$health_status" != "200" ] && [ "$health_status" != "503" ]; then
            echo "::error::The deployed Alerts health endpoint returned HTTP $health_status during signing-key validation."
            exit 1
          fi
          rotation_mode="$(node tools/validate_alert_capability_rotation.mjs \
            "$current_key_id" "$previous_key_id" < "$health_file")"
          echo "Alerts signing-key check: $rotation_mode"
          if [ "$rotation_mode" = "verified-same-key" ]; then
            echo "The deployed current and previous signing-key bindings are retained unchanged."
          elif [ "$rotation_mode" = "repair-previous-binding" ]; then
            printf '%s' "$ALERT_CAPABILITY_PREVIOUS_SECRET" | npx --yes wrangler@4.125.0 secret put ALERT_CAPABILITY_PREVIOUS_SECRET --config workers/alerts/wrangler.jsonc
          else
            printf '%s' "$ALERT_CAPABILITY_PREVIOUS_SECRET" | npx --yes wrangler@4.125.0 secret put ALERT_CAPABILITY_PREVIOUS_SECRET --config workers/alerts/wrangler.jsonc
            printf '%s' "$ALERT_CAPABILITY_SECRET" | npx --yes wrangler@4.125.0 secret put ALERT_CAPABILITY_SECRET --config workers/alerts/wrangler.jsonc
          fi
          echo "current_key_id=$current_key_id" >> "$GITHUB_OUTPUT"
      - name: Deploy the committed Alerts Worker
        id: worker-deploy
        if: ${{ steps.worker-inputs.outputs.deploy_required == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4.125.0 deploy
          --config workers/alerts/wrangler.jsonc
          --message "protected-main:${GITHUB_SHA}; protected main deployment"
      - name: Wait for the Alerts Worker health contract
        id: worker-health
        if: ${{ steps.worker-inputs.outputs.deploy_required == 'true' }}
        shell: bash
        run: |
          recovery_required=false
          for attempt in {1..12}; do
            health_file="$(mktemp)"
            health_status="$(curl --silent --show-error --max-time 10 --output "$health_file" --write-out '%{http_code}' -H 'Origin: https://mporosoff.github.io' 'https://funding-finder-alerts.urochestercheme.workers.dev/health' || true)"
            health="$(cat "$health_file")"
            rm -f "$health_file"
            common_ready=false
            if test "$(jq -r '.schema_version // empty' <<<"$health" 2>/dev/null)" = "3" \
              && test "$(jq -r '.database_ready | tostring' <<<"$health" 2>/dev/null)" = "true" \
              && test "$(jq -r '.email_provider_selected | tostring' <<<"$health" 2>/dev/null)" = "true" \
              && test "$(jq -r '.email_provider_configured | tostring' <<<"$health" 2>/dev/null)" = "true" \
              && test "$(jq -r '.email_template_version // empty' <<<"$health" 2>/dev/null)" = "phase4-operations-20260827" \
              && test "$(jq -r '.outbound_email_enabled | tostring' <<<"$health" 2>/dev/null)" = "true" \
              && test "$(jq -r '.capability_previous_signing_ready | tostring' <<<"$health" 2>/dev/null)" = "true" \
              && test "$(jq -r '.capability_key_id // empty' <<<"$health" 2>/dev/null)" = "${{ steps.capability-secrets.outputs.current_key_id }}"; then
              common_ready=true
            fi
            if test "$health_status" = "200" \
              && test "$common_ready" = "true" \
              && test "$(jq -r '.service // empty' <<<"$health" 2>/dev/null)" = "available" \
              && test "$(jq -r '.delivery_ready | tostring' <<<"$health" 2>/dev/null)" = "true" \
              && test "$(jq -r '.scheduler_ready | tostring' <<<"$health" 2>/dev/null)" = "true"; then
              echo "recovery_required=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            daily_status="$(jq -r '.last_daily_run_status // empty' <<<"$health" 2>/dev/null)"
            daily_completed_at="$(jq -r '.last_daily_run_completed_at // empty' <<<"$health" 2>/dev/null)"
            if test "$health_status" = "503" \
              && test "$common_ready" = "true" \
              && test "$(jq -r '.service // empty' <<<"$health" 2>/dev/null)" = "unavailable" \
              && test "$(jq -r '.delivery_ready | tostring' <<<"$health" 2>/dev/null)" = "false" \
              && test "$(jq -r '.scheduler_ready | tostring' <<<"$health" 2>/dev/null)" = "false" \
              && test "$daily_status" = "failed_stale_recovered" \
              && test "$daily_completed_at" = "2026-08-28T13:37:40.002Z"; then
              recovery_required=true
              echo "recovery_required=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          echo "::error::The Alerts Worker health contract did not become available."
          exit 1
      - name: Run bounded Alerts Worker smokes
        id: worker-smoke
        if: ${{ steps.worker-inputs.outputs.deploy_required == 'true' && steps.worker-health.outputs.recovery_required != 'true' }}
        run: node tools/smoke_alerts_worker.mjs
      - name: Record the truthful scheduler recovery gate
        if: ${{ steps.worker-inputs.outputs.deploy_required == 'true' && steps.worker-health.outputs.recovery_required == 'true' }}
        shell: bash
        run: |
          {
            echo "### Alerts scheduler recovery required"
            echo
            echo "The Worker, D1 migration, provider, and signing contracts are deployed, but delivery readiness remains false until one bounded genuine daily scheduler recovery execution succeeds."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify Pages serves the committed alert surfaces
        id: pages-verify
        shell: bash
        run: |
          verified=false
          for attempt in $(seq 1 18); do
            curl --fail --silent --show-error --max-time 15 "https://mporosoff.github.io/grants-scraper/match_explorer.html?deploy=${GITHUB_SHA}" -o /tmp/match_explorer.html || true
            curl --fail --silent --show-error --max-time 15 "https://mporosoff.github.io/grants-scraper/funded_awards.html?deploy=${GITHUB_SHA}" -o /tmp/funded_awards.html || true
            if cmp -s match_explorer.html /tmp/match_explorer.html && cmp -s funded_awards.html /tmp/funded_awards.html; then
              verified=true
              break
            fi
            sleep 10
          done
          if [ "$verified" != "true" ]; then
            echo "::error::GitHub Pages did not serve the committed alert surfaces within the verification window."
            exit 1
          fi
      - name: Record retained Alerts Worker version
        if: ${{ steps.worker-inputs.outputs.deploy_required != 'true' }}
        shell: bash
        run: |
          {
            echo "### Alerts Worker deployment"
            echo
            echo "Existing deployed Alerts Worker version retained because deployment inputs were unchanged."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Restore the prior Alerts Worker after a failed release smoke
        if: ${{ always() && steps.worker-deploy.outcome == 'success' && steps.prior-worker.outputs.version_id != '' && (steps.worker-health.outcome == 'failure' || steps.worker-smoke.outcome == 'failure' || steps.pages-verify.outcome == 'failure') }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.125.0 rollback \
            "${{ steps.prior-worker.outputs.version_id }}" \
            --config workers/alerts/wrangler.jsonc \
            --message "protected-main:${{ steps.worker-inputs.outputs.deployed_base_sha }}; automatic rollback after Alerts release failure"
          npx --yes wrangler@4.125.0 d1 execute funding-finder-alerts --remote \
            --config workers/alerts/wrangler.jsonc \
            --command "UPDATE notification_events SET status = 'suppressed', error_code = 'worker_version_rollback', claimed_at = NULL, terminal_at = strftime('%Y-%m-%dT%H:%M:%fZ','now') WHERE message_kind = 'verification' AND terminal_at IS NULL AND status IN ('queued','failed','sending')"
      - name: Refuse a release if protected main advanced
        if: ${{ steps.worker-health.outcome == 'success' && (steps.worker-smoke.outcome == 'success' || steps.worker-health.outputs.recovery_required == 'true') }}
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          current_main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ -z "$current_main_sha" ] || [ "$current_main_sha" != "${{ steps.release-base.outputs.main_sha }}" ]; then
            if [ -n "${{ steps.prior-worker.outputs.version_id }}" ]; then
              npx --yes wrangler@4.125.0 rollback "${{ steps.prior-worker.outputs.version_id }}" --config workers/alerts/wrangler.jsonc --message "protected-main:${{ steps.worker-inputs.outputs.deployed_base_sha }}; automatic rollback because main advanced"
              npx --yes wrangler@4.125.0 d1 execute funding-finder-alerts --remote --config workers/alerts/wrangler.jsonc --command "UPDATE notification_events SET status = 'suppressed', error_code = 'worker_version_rollback', claimed_at = NULL, terminal_at = strftime('%Y-%m-%dT%H:%M:%fZ','now') WHERE message_kind = 'verification' AND terminal_at IS NULL AND status IN ('queued','failed','sending')"
            fi
            echo "::error::Protected main advanced during the Alerts release."
            exit 1
          fi
